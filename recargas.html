<style>
:root{
  --bg:#0D0A06; --bg-2:#14100A; --surface:#191409; --surface-2:#231C10; --surface-3:#2E2515; --line:#33291A;
  --ink:#F5ECD8; --muted:#A79A80; --accent-text:#FFC72C; --gold:#F6B90A; --gold-2:#FFD84A; --gold-ink:#1A1206;
  --glow:rgba(246,185,10,.18);
  --danger:#FF7A6B; --danger-bg:rgba(255,122,107,.13); --ok:#5FD49C; --ok-bg:rgba(95,212,156,.12);
  --info:#8DB8F2; --info-bg:rgba(141,184,242,.13); --warn-bg:rgba(246,185,10,.13); --chip:#2A2216;
  --shadow:0 24px 60px rgba(0,0,0,.55);
  --display:'Chakra Petch','Arial Narrow',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F6F1E6; --bg-2:#EFE8D8; --surface:#FFFFFF; --surface-2:#F4EEE1; --surface-3:#EAE1CD; --line:#E0D6C2;
    --ink:#1E1910; --muted:#6C614D; --accent-text:#946600; --gold:#F6B90A; --gold-2:#FFC929; --gold-ink:#1A1408;
    --glow:rgba(246,185,10,.22); --danger:#C23A2F; --danger-bg:#FBE7E4; --ok:#1E8556; --ok-bg:#E2F3EA; --info:#2F67B0; --info-bg:#E4EDF8; --warn-bg:#FDF1CF; --chip:#E9E2D2;
    --shadow:0 18px 50px rgba(40,28,6,.18); color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F6F1E6; --bg-2:#EFE8D8; --surface:#FFFFFF; --surface-2:#F4EEE1; --surface-3:#EAE1CD; --line:#E0D6C2;
  --ink:#1E1910; --muted:#6C614D; --accent-text:#946600; --gold:#F6B90A; --gold-2:#FFC929; --gold-ink:#1A1408;
  --glow:rgba(246,185,10,.22); --danger:#C23A2F; --danger-bg:#FBE7E4; --ok:#1E8556; --ok-bg:#E2F3EA; --info:#2F67B0; --info-bg:#E4EDF8; --warn-bg:#FDF1CF; --chip:#E9E2D2;
  --shadow:0 18px 50px rgba(40,28,6,.18); color-scheme:light;
}
:root[data-theme="dark"]{ color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15}
h1{font-size:26px;font-weight:700} h2{font-size:17px;font-weight:600} h3{font-size:14.5px;font-weight:600}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)} .pos{color:var(--ok)} .neg{color:var(--danger)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.gold:hover{background:var(--gold-2)}
.btn.quiet{background:transparent;border-color:transparent}
.btn.bad{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px var(--glow)}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f{min-width:0}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--chip)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--danger-bg);color:var(--danger)} .pill.warn{background:var(--warn-bg);color:var(--accent-text)} .pill.info{background:var(--info-bg);color:var(--info)}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:16px;background:radial-gradient(800px 400px at 50% -10%, var(--glow), transparent)}
.login .card{width:min(400px,100%);padding:28px;box-shadow:var(--shadow)}
.login img{width:84px;display:block;margin:0 auto 10px;filter:drop-shadow(0 0 16px rgba(246,185,10,.35))}
.login h1{text-align:center;font-size:24px}
.login p{text-align:center;color:var(--muted);margin:6px 0 20px;font-size:14px}
.login .f{margin-bottom:12px}
.demo{margin-top:16px;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px}
.demo code{background:var(--chip);padding:1px 6px;border-radius:6px;color:var(--ink)}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-top:4px}

/* app */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top img{width:40px;height:40px;object-fit:contain}
.top .brand b{display:block;font:700 18px/1 var(--display);letter-spacing:.05em;color:var(--accent-text)}
.top .brand span{font-size:12px;color:var(--muted)}
.top .sp{flex:1}
.top .who{font-size:13px;color:var(--muted);text-align:right}
.top .who b{color:var(--ink);display:block;font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13.5px}
.tab.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.wrap{max-width:1380px;margin:0 auto;padding:20px}
.bar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.bar .f{width:auto}
.bar select,.bar input{min-width:170px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi small{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.kpi b{display:block;font:700 24px/1.2 var(--display);margin-top:4px}
.kpi em{font-style:normal;font-size:12.5px;color:var(--muted)}
.kpi.hl{border-color:var(--gold);background:linear-gradient(180deg,var(--warn-bg),var(--surface))}
.kpi.hl b{color:var(--accent-text)}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}

/* dropzone */
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;cursor:pointer;transition:.15s;background:var(--bg-2);position:relative}
.drop:hover,.drop.over{border-color:var(--gold);background:var(--warn-bg)}
.drop svg{width:42px;height:42px;stroke:var(--accent-text);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.drop b{display:block;font:600 16px/1.3 var(--display);margin:6px 0 4px}
.drop span{font-size:13px;color:var(--muted)}
.prev{display:grid;grid-template-columns:130px minmax(0,1fr);gap:16px;margin-top:14px;align-items:start}
.prev .img{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg-2);aspect-ratio:3/4;display:grid;place-items:center;cursor:zoom-in}
.prev .img img{width:100%;height:100%;object-fit:contain}
.prog{height:6px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}
.auto{position:relative}
.auto.read input,.auto.read select{border-color:color-mix(in srgb,var(--ok) 60%,var(--line))}
.auto .tagr{position:absolute;right:8px;top:0;font-size:11px;color:var(--ok);font-weight:700}
.alert{border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:12px;display:flex;gap:8px;align-items:flex-start}
.alert.bad{background:var(--danger-bg);color:var(--danger)}
.alert.ok{background:var(--ok-bg);color:var(--ok)}
.alert.warn{background:var(--warn-bg);color:var(--accent-text)}
.alert.info{background:var(--info-bg);color:var(--info)}
.tipo{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.tipo button{border:1px solid var(--line);background:var(--bg-2);border-radius:10px;padding:8px 6px;cursor:pointer;font-size:12.5px;font-weight:600;line-height:1.2}
.tipo button small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:2px}
.tipo button.on{border-color:var(--gold);background:var(--warn-bg);color:var(--accent-text)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* cuadre */
.cq{width:100%;border-collapse:collapse;font-size:14.5px}
.cq td{padding:8px 0;border-bottom:1px solid var(--line)}
.cq td:last-child{text-align:right}
.cq tr.tot td{border-bottom:0;padding-top:12px;font:700 18px/1.2 var(--display)}
.dif{margin-top:12px;border-radius:12px;padding:14px;text-align:center}
.dif b{display:block;font:700 26px/1.2 var(--display)}
.dif.ok{background:var(--ok-bg);color:var(--ok)} .dif.bad{background:var(--danger-bg);color:var(--danger)} .dif.na{background:var(--surface-2);color:var(--muted)}
.banks{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.banks span{background:var(--chip);border-radius:8px;padding:4px 9px;font-size:12.5px}

/* tabla */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-top:18px}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:860px}
.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t td small{display:block;color:var(--muted);font-size:12px}
.t .r{text-align:right}
.t tr.anul td{opacity:.45;text-decoration:line-through}
.t tr.anul td:last-child{text-decoration:none;opacity:1}
.thumb{width:38px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;display:block}
.sech{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.modal.img{width:auto;max-width:min(900px,100%);padding:10px}
.modal.img img{max-height:82vh;display:block}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.x{border:0;background:transparent;font-size:24px;cursor:pointer;color:var(--muted);line-height:1}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.bad{background:var(--danger);color:#fff}
.empty{padding:28px;text-align:center;color:var(--muted)}
.lst{display:flex;flex-direction:column;gap:8px}
.lst .row{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr auto;gap:8px;align-items:end}
.sim{font-size:12px;background:var(--warn-bg);color:var(--accent-text);border-radius:999px;padding:3px 10px;font-weight:700}

.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{background:#080604;color:#EDE3CF;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px 16px;border-right:1px solid #241C10;overflow-y:auto}
.sbrand{display:flex;align-items:center;gap:12px;padding:0 6px 18px}.sbrand img{width:54px;height:54px;object-fit:contain;filter:drop-shadow(0 0 14px rgba(246,185,10,.35))}
.sbrand b{display:block;font:700 21px/1 var(--display);letter-spacing:.05em;color:#FFD23F}.sbrand span{font-size:12.5px;color:#8E8268}
.navg{font-size:12px;color:#8E8268;padding:14px 12px 6px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;color:#CFC3AB;font-weight:500;position:relative;cursor:default}
.nav button:disabled{opacity:.55}
.nav button.on{background:#21190B;color:#FFD23F;font-weight:600}.nav button.on::before{content:'';position:absolute;left:-14px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:#F6B90A}
.nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sfoot{margin-top:auto;font-size:12.5px;color:#8E8268;padding:12px 8px 0;border-top:1px solid #241C10}
.sfoot p{margin:8px 0 0;line-height:1.4}
.ucard{display:flex;gap:10px;align-items:center;margin-bottom:10px}.ucard b{display:block;color:#EDE3CF;font-size:14px}.ucard small{color:#8E8268}
.av{width:34px;height:34px;border-radius:50%;background:#F6B90A;color:#1A1206;display:grid;place-items:center;font-weight:700}
.rolp{display:inline-block;background:rgba(246,185,10,.15);color:#FFD23F;border:1px solid rgba(246,185,10,.4);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.rolp.top{color:var(--accent-text);background:var(--warn-bg)}
.mainc{min-width:0}
.top .mob{display:none;gap:10px;align-items:center}.ttl{font-size:22px;margin-right:6px}
.asw{width:auto}.asw label{font-size:11.5px;margin-bottom:2px}.asw select{padding:6px 10px;font-size:13.5px;min-width:220px}
.gs-prev{margin-top:12px;padding:10px 14px;border:1px dashed var(--line);border-radius:10px;font-size:14px}.gs-prev b{font-size:16px}
.embed .shell{grid-template-columns:1fr}.embed .side{display:none}.embed .top .mob{display:none!important}.embed .ttl{display:block!important}.embed [data-act=theme]{display:none}
@media (max-width:900px){.shell{grid-template-columns:1fr}.side{display:none}.top .mob{display:flex!important}.ttl{display:none}}
@media (max-width:640px){.asw{width:100%}.asw select{min-width:0}}
.bdg{display:inline-block;min-width:18px;padding:0 6px;border-radius:99px;background:var(--danger);color:#fff;font-size:11.5px;line-height:18px;margin-left:4px;text-align:center}
.tab.on .bdg{background:var(--gold-ink);color:var(--gold)}
.segf{display:flex;gap:6px;flex-wrap:wrap}
.c2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}
.cbx{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);font-weight:500;margin:6px 0}
.cbx input{width:auto}
@media (max-width:1100px){.c2{grid-template-columns:1fr}}
.tipo button{position:relative}.tipo .bdg{position:absolute;top:-7px;right:-7px;margin:0}
.pend{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;margin-top:8px;background:var(--bg-2)}
.pend b{display:block}.pend small b{display:inline}.pend small{color:var(--muted);font-size:12.5px}
.ctas{display:flex;flex-direction:column;gap:8px}.cta{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg-2)}
.cta b.num{font:700 18px/1.2 var(--display)}.thumbs{display:flex;gap:6px}
.agcard{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg-2)}
.agh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}.agh b{display:block;font-size:15px}.agh small{color:var(--muted);font-size:12.5px}
.agst{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0 6px}.agst small{display:block;color:var(--muted);font-size:11.5px}.agst b{font:700 16px/1.2 var(--display)}.agst em{display:block;font-style:normal;font-size:11.5px;color:var(--muted)}
@media (max-width:640px){.agst{grid-template-columns:1fr 1fr}}
.jtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.jtab{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:600;font-size:14.5px;position:relative}
.jtab svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.jtab.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}.jtab .bdg{margin-left:2px}
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.xcol{display:flex;flex-direction:column;gap:12px}
.xcard{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.xcard.off{opacity:.75}
.xh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.xh b{display:block;font:600 17px/1.25 var(--display)}.xh small{color:var(--muted);font-size:13px}
.xh .amt{font:700 24px/1.1 var(--display);color:var(--accent-text)}
.xl{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 14px;font-size:14px;margin:0}.xl dt{color:var(--muted)}.xl dd{margin:0;overflow-wrap:anywhere}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative}
.steps .st{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:12px;font-weight:600;color:var(--muted);position:relative;padding-top:18px}
.steps .st::before{content:'';position:absolute;top:3px;width:12px;height:12px;border-radius:50%;background:var(--surface-3);border:2px solid var(--line);z-index:1}
.steps .st::after{content:'';position:absolute;top:9px;left:50%;width:100%;height:2px;background:var(--line)}
.steps .st:last-child::after{display:none}
.steps .st.done{color:var(--ok)}.steps .st.done::before{background:var(--ok);border-color:var(--ok)}.steps .st.done::after{background:var(--ok)}
.steps .st.bad{color:var(--danger)}.steps .st.bad::before{background:var(--danger);border-color:var(--danger)}
.steps .st small{font-weight:500;color:var(--muted);font-size:11.5px}
.msec{font-size:14px;margin:16px 0 8px;color:var(--accent-text)}
.btn.lg{padding:12px 20px;font-size:15px}
.grid1{display:block}
.qcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(460px,1fr));gap:16px}
.qcard{display:flex;flex-direction:column;gap:14px}
.qgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.qbox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg-2)}.qbox small{display:block;font-size:12px;color:var(--muted);font-weight:600}.qbox b{display:block;font:700 18px/1.3 var(--display);margin-top:2px}.qbox em{font-style:normal;font-size:11.5px;color:var(--muted)}
.qbox.in b{color:var(--ok)}.qbox.out b{color:var(--danger)}.qbox.hl{border-color:var(--gold);background:var(--warn-bg)}.qbox.hl b{color:var(--accent-text)}
.qreal{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:12px;align-items:end}.qreal .dif{margin:0;padding:8px}.qreal .dif b{font-size:20px}
.qmov summary{cursor:pointer;font-weight:600;font-size:14px}.qmov table{margin-top:8px;font-size:13px}.qmov .t td,.qmov .t th{padding:7px 8px}
.hero{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:22px;align-items:center;background:linear-gradient(135deg,var(--surface) 0%,var(--surface-2) 100%);border:1px solid var(--gold);border-radius:16px;padding:20px 22px;margin:0 0 16px;box-shadow:0 0 0 4px var(--glow)}
.hero-l small{display:block;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-text)}.hero-l>b{display:block;font:700 40px/1.1 var(--display);margin:4px 0 4px}.hero-l>span{display:block;font-size:13px;color:var(--muted)}.hero-l em{display:block;font-style:normal;font-size:12.5px;margin-top:10px}
.hero-dif{margin-top:10px;font-size:13px;padding:6px 10px;border-radius:8px;display:inline-block}.hero-dif.ok{background:var(--ok-bg);color:var(--ok)}.hero-dif.bad{background:var(--danger-bg);color:var(--danger)}
.stk{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--surface-3);gap:2px}.stk i{display:block;height:100%}
.lgd{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:12px}.lg{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg-2)}.lg>div:nth-child(2){flex:1;min-width:0}.lg b{display:block;font-size:14px}.lg small{display:block;font-size:11.5px;color:var(--muted)}.lg .r{text-align:right}.lg .r b{font:700 16px/1.2 var(--display)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;margin-right:6px;vertical-align:middle}.lg .dot{margin:0}
.sld{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}.sl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}.sl:first-child{border-top:0}.sl span{font-size:14px}.sl b{font:700 17px/1.2 var(--display)}.sl.tot{background:var(--warn-bg)}.sl.tot span{font-weight:700}.sl.tot b{font-size:24px;color:var(--accent-text)}
.mvflow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:end;margin-top:14px}.mvarrow{font:700 22px/1 var(--display);color:var(--accent-text);padding-bottom:10px}
.qcard .cq{font-size:13.5px}.qcard .cq td{padding:5px 0}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero-l>b{font-size:34px}.mvflow{grid-template-columns:1fr}.mvarrow{display:none}}
@media (max-width:640px){.qcards{grid-template-columns:1fr}.qgrid{grid-template-columns:1fr 1fr}.qreal{grid-template-columns:1fr}}
.xfotos{display:flex;gap:10px}.xfotos figure{margin:0;text-align:center}.xfotos img{width:64px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block}.xfotos figcaption{font-size:11.5px;color:var(--muted);margin-top:3px}
.xf{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:12px;flex-wrap:wrap}
.cta.tot{background:transparent;border-style:dashed}
.prevrow{display:flex;gap:12px;align-items:center;margin-top:10px}.prevrow img{width:70px;height:88px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}.prevrow small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
@media (max-width:640px){.xgrid{grid-template-columns:1fr}.xl{grid-template-columns:110px minmax(0,1fr)}}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid{grid-template-columns:1fr}}
@media (max-width:640px){
  .wrap{padding:16px}.top{padding:10px 16px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi b{font-size:20px}
  .fg{grid-template-columns:1fr}.tipo{grid-template-columns:repeat(2,1fr)}
  .prev{grid-template-columns:90px minmax(0,1fr)}
  .bar select,.bar input{min-width:0;width:100%}.bar .f{flex:1 1 140px}
  .lst .row{grid-template-columns:1fr 1fr}.top .who{display:none}
}
@media print{.top,.noprint,.drop,.prev{display:none!important}.grid{grid-template-columns:1fr}body{background:#fff;color:#000}}

async function getWorker(onProg){

async function prepImage(url){
  const im = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
  const sc = Math.min(2.5, Math.max(1, 1600/Math.max(im.width,1)));
  const c = document.createElement('canvas'); c.width = Math.round(im.width*sc); c.height = Math.round(im.height*sc);
  const x = c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height);
  const d = x.getImageData(0,0,c.width,c.height), p = d.data; let sumL = 0;
  for(let i=0;i<p.length;i+=4){ const l = .299*p[i]+.587*p[i+1]+.114*p[i+2]; sumL += l; }
  const dark = sumL/(p.length/4) < 110;
  for(let i=0;i<p.length;i+=4){ let l = .299*p[i]+.587*p[i+1]+.114*p[i+2]; if(dark) l = 255-l; l = l<150 ? l*.6 : Math.min(255, l*1.15); p[i]=p[i+1]=p[i+2]=l; }
  x.putImageData(d,0,0);
  const t = document.createElement('canvas'); const ts = Math.min(1, 420/Math.max(im.width, im.height)); t.width = Math.round(im.width*ts); t.height = Math.round(im.height*ts); t.getContext('2d').drawImage(im,0,0,t.width,t.height);
  return {ocr:c, thumb:t.toDataURL('image/jpeg', .6)};
}
async function pdfToImage(file){
  if(!window.pdfjsLib){ await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'); pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }
  const pdf = await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise; const pg = await pdf.getPage(1);
  const tc = await pg.getTextContent(); let last = null, txt = '';
  tc.items.forEach(it=>{ const y = Math.round(it.transform[5]); txt += (last!==null && Math.abs(y-last)>3 ? '\n' : ' ') + it.str; last = y; });
  const vp = pg.getViewport({scale:1.6}); const c = document.createElement('canvas'); c.width=vp.width; c.height=vp.height; await pg.render({canvasContext:c.getContext('2d'), viewport:vp}).promise;
  return {text:txt, url:c.toDataURL('image/jpeg', .85)};
}
async function leerComprobante(file){

  }
}
async function registrar(){
  const op = opActual(), f = UI.form, t = TIPOS[UI.tipo];
  if(t.quien !== (isAdm()?'adm':'op')) return toast('Tu usuario no puede registrar este movimiento.', true);
  if(UI.tipo==='transfer'){ if(!f.opDest) return toast('Elige a qué operador le pasas saldo.', true); if(f.opDest===op) return toast('Elige otro operador.', true); }
  if(UI.tipo==='mover'){ if(!f.from || !f.to) return toast('Elige de dónde sale y a dónde entra el dinero.', true); if(f.from===f.to) return toast('Elige dos cuentas distintas.', true); }
  const monto = r2(f.monto);
  if(!(monto>0)) return toast('Escribe el monto.', true);
  if(UI.tipo==='mover'){ const sd = saldoLugar(op, f.from, UI.fecha); if(monto > sd + 0.005 && !(await ask('Saldo insuficiente', `${esc(lugarL(f.from))} tiene <b>${money(sd)}</b> y vas a mover <b>${money(monto)}</b>. ¿Registrar igual?`, {ok:'Registrar igual'}))) return; }

  if(t.comp && !String(f.comprobante||'').trim()) return toast('Escribe el número de comprobante.', true);
  if(t.comp && !String(f.banco||'').trim()) return toast('Escribe el banco.', true);
  if(UI.tipo==='ajuste' && !String(f.nota||'').trim()) return toast('Escribe el motivo del ajuste.', true);
  if(isAdm() && UI.tipo==='carga'){ const dst = f.dest||'caja', q = f.signo==='-', ant = saldoLugar(op, dst, UI.fecha); if(!(await ask(q?'Confirmar: quitar saldo':'Confirmar: aumentar saldo', `¿${q?'Quitar':'Aumentar'} <b>${money(monto)}</b> ${q?'de':'a'} <b>${esc(opName(op))}</b>?<br><span class="muted">${esc(lugarL(dst))}: ${money(ant)} → <b>${money(ant + (q?-monto:monto))}</b> · ${fd(UI.fecha)}</span>${f.nota?`<br><span class="muted">Motivo: ${esc(f.nota)}</span>`:''}`, {ok:q?'Sí, quitar':'Sí, aumentar', danger:q}))) return; }
  if(t.comp && (duplicado(f.banco, f.comprobante) || duplicadoFlexible(f.comprobante))) return toast('Ese comprobante ya fue registrado.', true);
  const R = resumen(op, UI.fecha);
  if((UI.tipo==='recarga'||UI.tipo==='transfer') && monto > R.esperado + 0.005 && !(await ask('Caja insuficiente', `La caja tiene <b>${money(R.esperado)}</b> y la recarga es de <b>${money(monto)}</b>. La caja quedará en negativo. ¿Registrar igual?`, {ok:'Registrar igual'}))) return;
  const ver = t.comp && f.cuentaDest ? cuentaEmpresa(f.cuentaDest) : null;
  const m = {id:uid('m'), ts:Date.now(), op, fecha:UI.fecha, tipo:UI.tipo, agente:f.agente||'', monto, banco:t.comp?f.banco.trim():'', comprobante:t.comp?String(f.comprobante).trim():'', nombre:t.comp?(f.nombre||'').trim():'', fechaComp:t.comp?(f.fecha||UI.fecha):'', cuentaDest:f.cuentaDest||'', verif: ver===null?null:!!ver, nota:(f.nota||'').trim(), signo: UI.tipo==='ajuste' ? (+f.signo||1) : undefined, img:t.comp?UI.img:null, auto:Object.keys(UI.read), usuario:SES.usuario, opDest: UI.tipo==='transfer' ? f.opDest : undefined, dest: UI.tipo==='carga' ? (f.dest||'caja') : undefined, signo: UI.tipo==='carga' ? (f.signo==='-'?-1:1) : (UI.tipo==='ajuste' ? (f.signo==='-'||f.signo==-1?-1:1) : undefined), from: UI.tipo==='mover' ? f.from : undefined, to: UI.tipo==='mover' ? f.to : undefined};
  if(m.tipo==='recarga') m.rev = '';
  S.movs.push(m); save();
  if(m.tipo==='recarga') tgComprobante(m);
  if(m.tipo==='carga') logAcc('Gestión de saldo', `${m.signo<0?'Quitó':'Aumentó'} ${money(monto)} · ${opName(op)} → ${lugarL(m.dest)}${m.nota?' · '+m.nota:''}`);
  if(m.tipo==='ajuste') logAcc('Ajuste', `${m.signo<0?'−':'+'}${money(monto)} en ${opName(op)} · ${m.nota}`);
  if(m.tipo==='transfer') tgSend(`🔁 <b>Traspaso de saldo</b>\n${esc(opName(op))} → ${esc(opName(m.opDest))}: ${money(monto)}${m.nota?'\n'+esc(m.nota):''}`, 'alertas');
  if(m.tipo==='carga') tgSend(`💰 <b>Gestión de saldo</b>\n${esc(opName(op))} → ${esc(lugarL(m.dest))}: ${m.signo<0?'−':'+'}${money(monto)}${m.nota?'\n'+esc(m.nota):''}`, 'alertas');
  UI.form = {}; UI.read = {}; UI.img = null; UI.ocr = null;
  render();
  const nR = resumen(op, UI.fecha);
  toast(m.tipo==='carga' ? `${m.signo<0?'Se quitaron':'Se aumentaron'} ${money(monto)} ${m.signo<0?'de':'a'} ${lugarL(m.dest)} de ${opName(op)}. Saldo de caja: ${money(nR.esperado)}.` : m.tipo==='mover' ? `Moviste ${money(monto)}: ${lugarL(m.from)} → ${lugarL(m.to)}. El total no cambia.` : m.tipo==='carga' && m.dest!=='caja' ? `Inyección de ${money(monto)} a ${lugarL(m.dest)} de ${opName(op)}.` : m.tipo==='transfer' ? `Pasaste ${money(monto)} a ${opName(m.opDest)}. Tu saldo: ${money(nR.esperado)}.` : `${t.label} de ${money(monto)} registrada. Saldo de caja de ${opName(op)}: ${money(nR.esperado)}.`);
}

let toastT;
function toast(msg, bad){ document.querySelectorAll('.toast').forEach(t=>t.remove()); const t = document.createElement('div'); t.className = 'toast'+(bad?' bad':''); t.setAttribute('role','status'); t.textContent = msg; document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(()=>t.remove(), 4200); }
function ask(title, msg, opt={}){
  return new Promise(res=>{ const ov = document.createElement('div'); ov.className='ov';
    ov.innerHTML = `<form class="modal" role="dialog" aria-modal="true" aria-labelledby="askT" novalidate><div class="mh"><h2 id="askT">${esc(title)}</h2></div><p style="margin:0 0 14px">${msg}</p>${opt.input?`<input id="askIn" placeholder="${esc(opt.input)}">`:''}<div class="acts" style="justify-content:flex-end;margin-top:16px"><button type="button" class="btn" data-no>Cancelar</button><button class="btn ${opt.danger?'bad':'gold'}" type="submit">${esc(opt.ok||'Aceptar')}</button></div></form>`;
    const done = v=>{ ov.remove(); res(v); };
    ov.querySelector('[data-no]').onclick = ()=>done(null);
    ov.querySelector('form').onsubmit = e=>{ e.preventDefault(); const i = ov.querySelector('#askIn'); if(i && !i.value.trim()){ i.focus(); i.style.borderColor='var(--danger)'; return; } done(i ? i.value.trim() : true); };
    document.body.appendChild(ov); (ov.querySelector('#askIn')||ov.querySelector('[type=submit]')).focus(); });
}
function modal(html, cls){ const ov = document.createElement('div'); ov.className='ov'; ov.innerHTML = `<div class="modal ${cls||''}" role="dialog" aria-modal="true">${html}</div>`; ov.addEventListener('click', e=>{ if(e.target===ov || e.target.closest('[data-close]')) ov.remove(); }); document.body.appendChild(ov); }
function csvOut(){
  const op = opActual(), f = UI.fecha; const R = resumen(op,f); let run = R.ini;
  const rows = [['Hora','Tipo','Agente','Cuenta','Banco','Comprobante','Depositante','Fecha comprobante','Monto','Efecto en caja','Saldo','Estado','Nota']];
  movsDe(op,f).forEach(m=>{ const e = efecto(m, op); if(!m.anulado) run = r2(run+e.caja); const a = S.agentes.find(x=>x.id===m.agente)||{}; rows.push([hm(m.ts), TIPOS[m.tipo].label, a.nombre||'', a.cuenta||'', m.banco, m.comprobante, m.nombre, m.fechaComp?fd(m.fechaComp):'', NF.format(m.monto), NF.format(e.caja), m.anulado?'':NF.format(run), m.anulado?'Anulado':'Válido', m.nota]); });
  rows.push([], ['Saldo inicial','','','','','','','','','',NF.format(R.ini)], ['Saldo esperado','','','','','','','','','',NF.format(R.esperado)], ['Saldo real','','','','','','','','','',R.real==null?'':NF.format(R.real)], ['Diferencia','','','','','','','','','',R.dif==null?'':NF.format(R.dif)]);
  const csv = '﻿'+rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download = `cuadre-${(S.operadores.find(o=>o.id===op)?.nombre||op).replace(/\s+/g,'-').toLowerCase()}-${f}.csv`; document.body.appendChild(a); a.click(); a.remove();
}
document.addEventListener('click', async e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act, op = opActual();
  if(a==='tab'){ UI.tab = b.dataset.k; render(); }
  else if(a==='logout'){ SES = null; try{ sessionStorage.removeItem('benderam-sim-ses'); }catch(e){} render(); }
  else if(a==='theme'){ const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'); document.documentElement.dataset.theme = cur==='light'?'dark':'light'; try{ localStorage.setItem('benderam-sim-theme', document.documentElement.dataset.theme); }catch(e){} }
  else if(a==='tipo'){ UI.tipo = b.dataset.k; renderForm(); }
  else if(a==='registrar') registrar();
  else if(a==='limpiar'){ UI.form = {}; UI.read = {}; UI.img = null; UI.ocr = null; renderForm(); }
  else if(a==='verPrev' && UI.img) modal(`<img src="${UI.img}" alt="Comprobante">`, 'img');
  else if(a==='ver'){ const m = S.movs.find(x=>x.id===b.dataset.id); if(m&&m.img) modal(`<img src="${imgSrc(m.img)}" alt="Comprobante">`, 'img'); }
  else if(a==='verTexto') modal(`<div class="mh"><h2>Texto leído del comprobante</h2><button class="x" data-close aria-label="Cerrar">×</button></div><pre style="white-space:pre-wrap;font-size:13px;background:var(--bg-2);padding:12px;border-radius:10px;max-height:60vh;overflow:auto">${esc(UI.ocr?.texto||'')}</pre>`);
  else if(['anular','reactivar','eliminar','editar','aprobar','reabrir'].includes(a) && !isAdm()){ toast('Solo gerencia puede hacer esto.', true); }
  else if(a==='editar'){ editarMov(b.dataset.id); }
  else if(a==='eliminar'){ const m = S.movs.find(x=>x.id===b.dataset.id); const mot = await ask('Eliminar movimiento', `${TIPOS[m.tipo].label} de <b>${money(m.monto)}</b>${m.comprobante?` · comprobante ${esc(m.comprobante)}`:''}. Se borra para siempre; si solo fue un error, mejor <b>anúlalo</b>. Escribe el motivo.`, {input:'Motivo de la eliminación', ok:'Eliminar', danger:true}); if(!mot) return; S.movs = S.movs.filter(x=>x.id!==m.id); logAcc('Eliminó movimiento', `${TIPOS[m.tipo].label} ${money(m.monto)} de ${opName(m.op)}${m.comprobante?' · comp. '+m.comprobante:''} · ${mot}`); save(); render(); toast('Movimiento eliminado.'); }
  else if(a==='aprobar'){ const R = resumen(op, UI.fecha); if(R.dif!=null && Math.abs(R.dif)>=0.005 && !(await ask('Aprobar con diferencia', `El cuadre tiene un <b>${R.dif<0?'faltante':'sobrante'} de ${money(Math.abs(R.dif))}</b>. ¿Aprobar igual?`, {ok:'Aprobar igual'}))) return; const c = caja(op,UI.fecha); c.aprobada = true; c.aprobadaPor = SES.nombre; c.aprobadaEn = Date.now(); logAcc('Aprobó cuadre', `${opName(op)} · ${fd(UI.fecha)} · esperado ${money(R.esperado)} · real ${money(R.real)}`); save(); render(); toast('Cuadre aprobado.'); }
  else if(a==='anular'){ const m = S.movs.find(x=>x.id===b.dataset.id); const mot = await ask('Anular movimiento', `${TIPOS[m.tipo].label} de <b>${money(m.monto)}</b>${m.comprobante?` · comprobante ${esc(m.comprobante)}`:''}. Escribe el motivo; queda registrado.`, {input:'Motivo de la anulación', ok:'Anular', danger:true}); if(!mot) return; m.anulado = true; m.motivoAnul = mot; m.anuladoPor = SES.usuario; logAcc('Anuló movimiento', `${TIPOS[m.tipo].label} ${money(m.monto)} de ${opName(m.op)}${m.comprobante?' · comp. '+m.comprobante:''} · ${mot}`); save(); render(); toast('Movimiento anulado. El saldo se recalculó.'); }
  else if(a==='reactivar'){ const m = S.movs.find(x=>x.id===b.dataset.id); if(duplicado(m.banco, m.comprobante, m.id)) return toast('No se puede: ese comprobante ya está usado en otro movimiento.', true); m.anulado = false; logAcc('Reactivó movimiento', `${TIPOS[m.tipo].label} ${money(m.monto)} de ${opName(m.op)}`); save(); render(); }
  else if(a==='cerrar'){ const R = resumen(op, UI.fecha); if(R.real==null) return toast('Escribe el saldo real de la caja de operador antes de cerrar.', true); const bkF = ctasDeOp(op).map(c=>ctaOpDia(c.id, UI.fecha)); if(bkF.some(d=>d.real==null)) return toast('Escribe el saldo real de cada cuenta de banco antes de cerrar.', true); const malos = [['Caja de operador', R.dif], ...bkF.map(d=>[`${d.c.banco} ····${String(d.c.numero).slice(-4)}`, d.dif])].filter(x=>Math.abs(x[1])>=0.005); if(malos.length && !(await ask('Cerrar con diferencia', `No cuadra:<br>${malos.map(([l,d])=>`• ${esc(l)}: <b>${d<0?'faltante':'sobrante'} de ${money(Math.abs(d))}</b>`).join('<br>')}<br>¿Cerrar igual? Gerencia lo verá.`, {ok:'Cerrar igual', danger:true}))) return; caja(op,UI.fecha).cerrada = true; caja(op,UI.fecha).cerradaPor = SES.usuario; caja(op,UI.fecha).cerradaEn = Date.now(); save(); render(); toast('Cuadre del día cerrado.'); const R2 = resumen(op, UI.fecha); const Q2 = saldosOp(op, UI.fecha); tgSend(`🔒 <b>Cierre de caja</b>\n${esc(S.operadores.find(o=>o.id===op)?.nombre)} · ${fd(UI.fecha)}\nRecargas: ${money(R2.rec)} (${R2.nRec})\nSaldo esperado: ${money(R2.esperado)}\nSaldo real: ${money(R2.real)}\n${Q2.bk.map(d=>`🏦 ${esc(d.c.banco)} ····${esc(String(d.c.numero).slice(-4))}: esperado ${money(d.esperado)} · real ${money(d.real)}`).join('\n')}\n💵 Total: ${money(Q2.total)} · real ${money(Q2.totReal)}\n${Math.abs(R2.dif)<0.005?'✅ Cuadrada':(R2.dif<0?'❗ Faltante ':'❗ Sobrante ')+money(Math.abs(R2.dif))}`, 'alertas'); }
  else if(a==='reabrir'){ const c = caja(op,UI.fecha); c.cerrada = false; c.aprobada = false; logAcc('Reabrió caja', `${opName(op)} · ${fd(UI.fecha)}`); save(); render(); toast('Caja reabierta.'); }
  else if(a==='csv') csvOut();
  else if(a==='print') window.print();
  else if(a==='irCaja'){ UI.op = b.dataset.id; UI.tab = 'cuadres'; render(); }
  else if(a==='addAg'){ S.agentes.push({id:uid('a'), nombre:'Nuevo agente', codigo:'', cuenta:'', op:S.operadores[0].id, titulares:''}); save(); render(); }
  else if(a==='delAg'){ if(await ask('Quitar agente', '¿Quitar este agente?', {ok:'Quitar', danger:true})){ S.agentes.splice(+b.dataset.i,1); save(); render(); } }
  else if(a==='addCta'){ S.cuentas.push({banco:'', numero:'', titular:'BENDERAM S.A.S.'}); save(); render(); }
  else if(a==='delCta'){ S.cuentas.splice(+b.dataset.i,1); save(); render(); }
  else if(a==='addOp'){ S.operadores.push({id:uid('op'), nombre:`Operador ${S.operadores.length+1}`}); save(); render(); }
  else if(a==='reset' && !LIVE){ if(await ask('Borrar datos de prueba', 'Se borrarán todos los movimientos y la configuración de prueba.', {ok:'Borrar todo', danger:true})){ S = seed(); save(); render(); toast('Datos de prueba reiniciados.'); } }
});
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.dataset.k && t.closest('#formCard')){ UI.form[t.dataset.k] = t.value; delete UI.read[t.dataset.k];
    if(t.dataset.k==='agId'){ const ag = agByPlat(t.value); UI.form.agente = ag ? ag.id : ''; delete UI.read.agente; }
    if(['comprobante','banco','cuentaDest','fecha','agId'].includes(t.dataset.k)){ const pos = t.selectionStart; const id = t.id; renderForm(); const n = document.getElementById(id); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} } }
    return; }
  if(t.dataset.ag!=null){ S.agentes[+t.dataset.ag][t.dataset.k] = t.value; save(); return; }
  if(t.dataset.cta!=null){ S.cuentas[+t.dataset.cta][t.dataset.k] = t.value; save(); return; }
  if(t.dataset.opi!=null){ S.operadores[+t.dataset.opi].nombre = t.value; save(); return; }
  if(t.id==='realIn' && !isAdm()){ const c = caja(opActual(), UI.fecha); c[t.id==='realIn'?'real':'inicial'] = t.value; save(); const R = resumen(opActual(), UI.fecha); const d = $('#difBox'); if(d){ d.className = 'dif '+(R.dif==null?'na':Math.abs(R.dif)<0.005?'ok':'bad'); d.innerHTML = difHTML(R); } if(t.id==='iniIn'){ clearTimeout(window._iniT); window._iniT = setTimeout(()=>{ const p = t.selectionStart; render(); const n=$('#iniIn'); if(n){ n.focus(); try{n.setSelectionRange(p,p);}catch(_){} } }, 600); } }
});
document.addEventListener('change', e=>{
  const t = e.target;
  if(t.id==='asSel'){ const u = USERS.find(x=>x.usuario===t.value); SES = {usuario:u.usuario, nombre:u.nombre, rol:u.rol, op:u.op}; try{ sessionStorage.setItem('benderam-sim-ses', JSON.stringify(SES)); }catch(_){} UI.tab='caja'; UI.form={}; UI.read={}; UI.img=null; UI.ocr=null; render(); toast(u.rol==='ceo'?'Viendo como gerencia: acceso total.':`Viendo como ${u.nombre}: solo ve su caja y sus agentes.`); return; }
  if(t.id==='opSel'){ UI.op = t.value; UI.form = {}; render(); }
  else if(t.id==='fSel'){ UI.fecha = t.value || todayS(); render(); }
  else if(t.tagName==='SELECT' && t.dataset.k && t.closest('#formCard')){ UI.form[t.dataset.k] = t.value; delete UI.read[t.dataset.k]; }
  else if(t.dataset.ag!=null && t.tagName==='SELECT'){ S.agentes[+t.dataset.ag][t.dataset.k] = t.value; save(); }
});
document.addEventListener('submit', e=>{
  if(e.target.id!=='loginForm') return; e.preventDefault();
  const u = $('#lu').value.trim().toLowerCase(), p = $('#lp').value;
  const usr = USERS.find(x=>x.usuario===u && x.clave===p);
  if(!usr){ $('#lerr').textContent = 'Usuario o contraseña incorrectos.'; return; }
  SES = {usuario:usr.usuario, nombre:usr.nombre, rol:usr.rol, op:usr.op}; try{ sessionStorage.setItem('benderam-sim-ses', JSON.stringify(SES)); }catch(e){}
  UI.tab = 'caja'; render();
});
document.addEventListener('paste', e=>{
  if(!SES || UI.tab!=='caja' || !TIPOS[UI.tipo].comp) return;
  const it = [...(e.clipboardData?.items||[])].find(i=>i.kind==='file' && (i.type.startsWith('image/')||i.type==='application/pdf'));

});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') document.querySelectorAll('.ov').forEach(o=>o.remove()); });


function agLinea(f, op){
  const a = f.agente ? S.agentes.find(x=>x.id===f.agente) : null;
  if(a) return `<div class="alert ${a.op===op?'ok':'warn'}"><b>${a.op===op?'✓':'!'}</b><div><b>${esc(a.nombre)}</b> · ${esc(a.titular||'')} · ${esc(a.telefono||'')}${a.op!==op?` · <b>es agente de ${esc(opName(a.op))}</b>`:''}</div></div>`;
  if(String(f.agId||'').trim()) return `<div class="alert warn"><b>!</b><div><b>El ID ${esc(f.agId)} no está registrado.</b> Antes de recargarle, registra sus datos para guardarlo en Agencias.<div style="margin-top:8px"><button class="btn sm gold" data-act="agReg">Registrar agente</button></div></div></div>`;
  return '';
}

  el.innerHTML = `<h2 style="margin-bottom:4px">Registrar movimiento</h2><p class="muted" style="font-size:13px;margin:0 0 12px">Solo puedes registrar. Si te equivocas, avisa a gerencia para que lo corrija.</p>
    ${tipoBtns()}
    <div class="alert info" style="margin-top:0"><b>i</b><div>Úsalo cuando le prestas o pasas saldo a otro operador. Sale de tu caja y entra en la suya en el mismo momento. Tu saldo ahora: <b>${money(R.esperado)}</b>.</div></div>
    <div class="fg" style="margin-top:14px">
      <div class="f"><label for="fOd">Pasar saldo a</label><select id="fOd" data-k="opDest"><option value="">Elige el operador</option>${otros.map(o=>`<option value="${o.id}" ${f.opDest===o.id?'selected':''}>${esc(o.nombre)}</option>`).join('')}</select></div>
      <div class="f"><label for="fMo">Monto (USD)</label><input id="fMo" data-k="monto" type="number" step="0.01" min="0" inputmode="decimal" value="${esc(f.monto??'')}" placeholder="0,00"></div>
      <div class="f full"><label for="fNt">Motivo (opcional)</label><input id="fNt" data-k="nota" value="${esc(f.nota||'')}" placeholder="Ejemplo: préstamo de saldo, se devuelve mañana"></div>
    </div>
    <div class="acts" style="margin-top:16px;justify-content:flex-end"><button class="btn quiet" data-act="limpiar">Limpiar</button><button class="btn gold" data-act="registrar">Pasar saldo</button></div>`;
}
function editarMov(id){
  const m = S.movs.find(x=>x.id===id); if(!m) return;
  const ags = S.agentes.filter(a=>a.op===m.op);
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<form class="modal" role="dialog" aria-modal="true" aria-labelledby="edT" novalidate style="width:min(620px,100%)"><div class="mh"><h2 id="edT">Editar ${esc(TIPOS[m.tipo].label.toLowerCase())}</h2><button type="button" class="x" data-no aria-label="Cerrar">×</button></div>
    <p class="muted" style="font-size:13px;margin:-6px 0 12px">${esc(opName(m.op))} · ${fd(m.fecha)} ${hm(m.ts)} · registrado por ${esc(m.usuario||'')}</p>
    <div class="fg">
      ${m.tipo==='recarga'?`<div class="f"><label>Agente</label><select name="agente">${ags.map(a=>`<option value="${a.id}" ${m.agente===a.id?'selected':''}>${esc(a.nombre)}</option>`).join('')}</select></div>`:''}
      ${m.tipo==='transfer'?`<div class="f"><label>Pasado a</label><select name="opDest">${S.operadores.filter(o=>o.id!==m.op).map(o=>`<option value="${o.id}" ${m.opDest===o.id?'selected':''}>${esc(o.nombre)}</option>`).join('')}</select></div>`:''}
      ${m.tipo==='ajuste'?`<div class="f"><label>Efecto</label><select name="signo"><option value="1" ${m.signo!=-1?'selected':''}>Suma (+)</option><option value="-1" ${m.signo==-1?'selected':''}>Resta (−)</option></select></div>`:''}
      <div class="f"><label>Monto (USD)</label><input name="monto" type="number" step="0.01" min="0" value="${m.monto}"></div>
      ${m.tipo==='recarga'?`<div class="f"><label>Banco</label><input name="banco" list="bancosL3" value="${esc(m.banco)}"><datalist id="bancosL3">${BANCOS.map(b=>`<option value="${b[0]}">`).join('')}</datalist></div>
      <div class="f"><label>N.º de comprobante</label><input name="comprobante" value="${esc(m.comprobante)}"></div>
      <div class="f full"><label>Nombre del que transfiere</label><input name="nombre" value="${esc(m.nombre)}"></div>
      <div class="f"><label>Fecha del comprobante</label><input name="fechaComp" type="date" value="${esc(m.fechaComp||m.fecha)}"></div>
      <div class="f"><label>Cuenta destino</label><input name="cuentaDest" value="${esc(m.cuentaDest||'')}"></div>`:''}
      <div class="f full"><label>Nota</label><input name="nota" value="${esc(m.nota||'')}"></div>
      <div class="f full"><label>Motivo del cambio (obligatorio)</label><input name="motivo" placeholder="Ejemplo: el operador escribió mal el monto"></div>
    </div>
    ${(m.hist||[]).length?`<div style="margin-top:14px"><b style="font-size:13px">Cambios anteriores</b>${m.hist.slice().reverse().map(h=>`<div class="muted" style="font-size:12.5px;margin-top:4px">${new Date(h.ts).toLocaleString('es-EC')} · ${esc(h.por)}: ${esc(h.cambios)} (${esc(h.motivo)})</div>`).join('')}</div>`:''}
    <div class="err" id="edErr"></div>
    <div class="acts" style="justify-content:flex-end;margin-top:12px"><button type="button" class="btn" data-no>Cancelar</button><button class="btn gold" type="submit">Guardar cambios</button></div></form>`;
  document.body.appendChild(ov);
  ov.querySelectorAll('[data-no]').forEach(b=>b.onclick = ()=>ov.remove());
  ov.querySelector('form').onsubmit = e=>{
    e.preventDefault(); const v = Object.fromEntries(new FormData(e.target).entries()); const err = $('#edErr');
    if(!(+v.monto>0)){ err.textContent = 'Escribe un monto válido.'; return; }
    if(!(v.motivo||'').trim()){ err.textContent = 'Escribe el motivo del cambio.'; return; }
    if(m.tipo==='recarga' && (duplicado(v.banco, v.comprobante, m.id) || duplicadoFlexible(v.comprobante, m.id))){ err.textContent = 'Ese número de comprobante ya está en otro movimiento.'; return; }
    const L = {agente:'agente', opDest:'operador destino', signo:'efecto', monto:'monto', banco:'banco', comprobante:'comprobante', nombre:'nombre', fechaComp:'fecha', cuentaDest:'cuenta destino', nota:'nota'};
    const cambios = [];
    Object.keys(L).forEach(k=>{ if(!(k in v)) return; let nv = k==='monto' ? r2(v.monto) : k==='signo' ? +v.signo : v[k].trim(); const ov2 = m[k]; if(String(nv)!==String(ov2??'')){ const show = x => k==='monto'?money(x):k==='agente'?(S.agentes.find(a=>a.id===x)?.nombre||'—'):k==='opDest'?opName(x):k==='fechaComp'?fd(x):(x??'—'); cambios.push(`${L[k]}: ${show(ov2)} → ${show(nv)}`); m[k] = nv; } });
    if(!cambios.length){ ov.remove(); return; }
    if('cuentaDest' in v){ const ver = v.cuentaDest ? cuentaEmpresa(v.cuentaDest) : null; m.verif = ver===null?null:!!ver; }
    m.editado = true; (m.hist = m.hist||[]).push({ts:Date.now(), por:SES.nombre, cambios:cambios.join('; '), motivo:v.motivo.trim()});
    logAcc('Editó movimiento', `${TIPOS[m.tipo].label} de ${opName(m.op)}${m.comprobante?' · comp. '+m.comprobante:''} · ${cambios.join('; ')} · ${v.motivo.trim()}`);
    save(); ov.remove(); render(); toast('Cambios guardados. Quedan en la bitácora.');
  };
}

/* ================== Extracciones ================== */
const EXT_EST = {sol:{l:'Esperando aprobación del operador', c:'warn'}, aprob:{l:'Aprobada · falta comprobante', c:'warn'}, pagar:{l:'Aprobada y ejecutada · por pagar', c:'info'}, pagada:{l:'Pagada', c:'ok'}, rech:{l:'Rechazada por el operador', c:'bad'}, anulada:{l:'Anulada', c:''}};
const extEstado = x => x.anulado ? 'anulada' : x.rech ? 'rech' : !x.aprob ? 'sol' : !x.opReg ? 'aprob' : !x.pago ? 'pagar' : 'pagada';
const extPendOp = op => S.extr.filter(x=>x.op===op && ['sol','aprob'].includes(extEstado(x))).length;
const extPorPagar = () => S.extr.filter(x=>extEstado(x)==='pagar').length;
const extPendConta = () => S.extr.filter(x=>extEstado(x)==='pagada' && !x.rev).length;

async function leerArchivo(file, conTexto){
  const isPdf = file.type==='application/pdf' || /\.pdf$/i.test(file.name||'');
  if(!isPdf && !/^image\//.test(file.type)) throw new Error('Formato no válido');
  let text = '', url;
  if(isPdf){ const r = await pdfToImage(file); text = r.text; url = r.url; }
  else url = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
  const pi = await prepImage(url);
  if(conTexto && !text.trim()){ try{ const w = await getWorker(); text = (await w.recognize(pi.ocr)).data.text; }catch(e){} }
  return {thumb:pi.thumb, text};
}

/* ================== Agentes: registro, movimiento y cupo de extracción ================== */
const agByPlat = idp => { const k = String(idp||'').trim().replace(/^0+/,''); return k ? S.agentes.find(a=>String(a.idPlat||'').replace(/^0+/,'')===k) : null; };
const ymOf = f => String(f||'').slice(0,7);
function agStats(agId, f){
  const ym = ymOf(f||todayS());
  const recs = S.movs.filter(m=>m.tipo==='recarga' && !m.anulado && m.agente===agId);
  const exs = S.extr.filter(x=>x.agenteId===agId && !x.anulado && !x.rech);
  const exM = x => x.pago ? x.pago.monto : x.opReg ? x.opReg.monto : x.monto;
  const recMes = r2(recs.filter(m=>ymOf(m.fecha)===ym).reduce((a,m)=>a+m.monto,0)), extMes = r2(exs.filter(x=>ymOf(x.fecha)===ym).reduce((a,x)=>a+exM(x),0));
  const recTot = r2(recs.reduce((a,m)=>a+m.monto,0)), extTot = r2(exs.reduce((a,x)=>a+exM(x),0));
  const ult = recs.sort((a,b)=>b.ts-a.ts)[0];
  return {recMes, extMes, cupo:r2(recMes-extMes), recTot, extTot, nRecMes:recs.filter(m=>ymOf(m.fecha)===ym).length, ultimo:ult?ult.fecha:null};
}
const APTO = {si:{l:'Apto para extracción', c:'ok'}, no:{l:'NO apto para extracción', c:'bad'}, '':{l:'Pendiente de revisión', c:'warn'}};
function veredicto(a, monto){
  if(!a) return {ok:false, t:'Agente no registrado. Solo se puede extraer a agentes que ya recargaron y están en el sistema.'};
  if(a.apto==='no') return {ok:false, t:`<b>${esc(a.nombre)} NO es apto para extracción.</b>${a.aptoNota?' '+esc(a.aptoNota)+'.':''} Habla con gerencia.`};
  if(a.apto!=='si') return {ok:false, t:`<b>${esc(a.nombre)} está pendiente de revisión.</b> Gerencia debe marcarlo como apto para extracción.`};
  const st = agStats(a.id, UI.fecha);
  if(!(monto>0)) return {ok:null, t:`Cupo disponible este mes: <b>${money(Math.max(0,st.cupo))}</b>.`};
  if(monto > st.cupo + 0.005) return {ok:false, t:`<b>Negado por el sistema.</b> Pide ${money(monto)}, pero este mes solo ha recargado ${money(st.recMes)}${st.extMes?` y ya extrajo ${money(st.extMes)}`:''}. Cupo disponible: ${money(Math.max(0,st.cupo))}.`};
  return {ok:true, t:`<b>Aprobado por el sistema.</b> Este mes recargó ${money(st.recMes)}${st.extMes?` y extrajo ${money(st.extMes)}`:''}; después de esta extracción le quedan ${money(st.cupo-monto)} de cupo.`};
}

function movTxt(m, op){
  const ag = S.agentes.find(a=>a.id===m.agente);
  if(m.tipo==='recarga') return `Recarga · ${ag?ag.nombre:'agente'}${m.comprobante?' · N.º '+m.comprobante:''}`;
  if(m.tipo==='extraccion') return `Extracción · ${m.agencia||''}`;
  if(m.tipo==='carga') return `${(m.signo||1)<0?'Saldo quitado por gerencia':'Saldo aumentado por gerencia'}${m.dest&&m.dest!=='caja'?' · '+lugarCorto(m.dest):''}${m.nota?' · '+m.nota:''}`;
  if(m.tipo==='mover') return `${lugarCorto(m.from)} → ${lugarCorto(m.to)}${m.nota?' · '+m.nota:''}`;
  if(m.tipo==='transfer') return m.opDest===op ? `Recibido de ${opName(m.op)}` : `Pasado a ${opName(m.opDest)}`;
  if(m.tipo==='ajuste') return `Ajuste · ${m.nota||''}`;
  return TIPOS[m.tipo]?.label || m.tipo;
}

async function rcApi(action, payload){
  let res;
  try{ res = await fetch(SHEETS_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action, token:SES&&SES.token, ...(payload||{})})}); }
  catch(e){ return {ok:false, error:'Sin conexión con Google Sheets. Revisa tu internet.'}; }
  let j; try{ j = await res.json(); }catch(e){ return {ok:false, error:'Google Sheets respondió algo inesperado.'}; }
  if(j && !j.ok && j.error==='session'){ sesionTerminada(); }
  return j || {ok:false, error:'Respuesta vacía.'};
}
function sesionTerminada(){ clearInterval(LV.poll); try{ if(EMBED && window.parent.doLogout){ window.parent.doLogout(true); return; } }catch(e){} SES = null; LV.err = 'Tu sesión terminó. Vuelve a entrar al panel principal.'; render(); }

/* ---- registros <-> estado ---- */
const byTs = (a,b)=>(a.ts||0)-(b.ts||0);
function fromRecords(D){
  const v = c => Object.values(D[c]||{});
  const N = emptyS(), cf = D.rcf||{}, main = cf.main||{};
  N.movs = v('rmv').sort(byTs); N.extr = v('rex').sort(byTs); N.agentes = v('rag'); N.fondeos = v('rfo').sort(byTs); N.log = v('rlg').sort(byTs);
  N.operadores = main.operadores||[]; N.cuentas = main.cuentas||[]; N.ctasOp = main.ctasOp||[]; N.ctasExt = main.ctasExt||[];
  N.tg = {...N.tg, ...(cf.tg||{})};
  Object.entries(D.rcu||{}).forEach(([k,val])=>{ const i = k.indexOf('|'), p = k.slice(0,i), r = k.slice(i+1);
    if(p==='caja') N.cajas[r] = val; else if(p==='op') N.cuadOp[r] = val; else if(p==='ext') N.cuadExt[r] = val; else if(p==='conc') N.conc[r] = val.v; });
  return N;
}
function toRecords(X){
  const R = {}; RCOLS.forEach(c=>R[c]={});
  X.movs.forEach(m=>R.rmv[m.id]=m); X.extr.forEach(x=>R.rex[x.id]=x); X.agentes.forEach(a=>R.rag[a.id]=a); (X.fondeos||[]).forEach(f=>R.rfo[f.id]=f);
  (X.log||[]).forEach(l=>{ if(!l.id) l.id = `${l.ts}_${l.usuario}`; R.rlg[l.id] = l; });
  R.rcf.main = {operadores:X.operadores, cuentas:X.cuentas, ctasOp:X.ctasOp||[], ctasExt:X.ctasExt||[]};
  R.rcf.tg = X.tg;
  Object.entries(X.cajas||{}).forEach(([k,v])=>R.rcu['caja|'+k]=v); Object.entries(X.cuadOp||{}).forEach(([k,v])=>R.rcu['op|'+k]=v);
  Object.entries(X.cuadExt||{}).forEach(([k,v])=>R.rcu['ext|'+k]=v); Object.entries(X.conc||{}).forEach(([k,v])=>R.rcu['conc|'+k]={v});
  return R;
}
function vacio(col, id, v){
  if(col==='rcu' && id.startsWith('caja|')) return !v.cerrada && !v.aprobada && (v.inicial===''||v.inicial==null) && (v.real===''||v.real==null);
  if(col==='rcf' && id==='main') return !v.operadores.length && !v.cuentas.length && !v.ctasOp.length && !v.ctasExt.length;
  if(col==='rcf' && id==='tg') return !v.token && !v.chat;
  return false;
}
function snapDe(X){ const R = toRecords(X), sn = {}; RCOLS.forEach(c=>{ sn[c] = {}; Object.entries(R[c]).forEach(([id,v])=>sn[c][id] = JSON.stringify(v)); }); return sn; }

/* ---- fotos: se guardan aparte y el registro lleva una referencia ---- */
const FOTO_CARGANDO = 'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="60" height="80"><rect width="60" height="80" fill="#2a2216"/><text x="30" y="44" font-size="9" fill="#a79a80" text-anchor="middle" font-family="sans-serif">Cargando</text></svg>');
function imgSrc(v){
  if(!v) return ''; v = String(v); if(!v.startsWith('@f:')) return v;
  const id = v.slice(3); if(LV.fotos[id]) return LV.fotos[id];
  if(!LV.pendFotos.has(id)){ LV.pendFotos.add(id); clearTimeout(LV.ft); LV.ft = setTimeout(cargarFotos, 60); }
  return FOTO_CARGANDO;
}
const imgData = v => !v ? null : String(v).startsWith('@f:') ? (LV.fotos[String(v).slice(3)]||null) : v;
async function cargarFotos(){
  const ids = [...LV.pendFotos].filter(id=>!LV.fotos[id]).slice(0,25); if(!ids.length) return;
  const j = await rcApi('foto.get', {ids, col:'rmv'});
  if(j.ok){ Object.assign(LV.fotos, j.fotos||{}); ids.forEach(id=>{ if(!LV.fotos[id]) LV.fotos[id] = FOTO_CARGANDO.replace('Cargando','Sin%20foto'); }); }
  ids.forEach(id=>LV.pendFotos.delete(id));
  document.querySelectorAll('img').forEach(im=>{ const r = im.dataset.fref; if(r && LV.fotos[r]) im.src = LV.fotos[r]; });
  if(!liveOcupado()) render(); else LV.needRender = true;
  if(LV.pendFotos.size) cargarFotos();
}
function sacarFotos(){
  const subir = [];
  const fix = (o, k) => { if(!o || !o[k] || !String(o[k]).startsWith('data:')) return; const d = o[k]; let id = LV.dataId[d];
    if(!id){ id = 'rc_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); LV.dataId[d] = id; LV.fotos[id] = d; subir.push({id, data:d}); }
    o[k] = '@f:' + id; };
  S.movs.forEach(m=>fix(m,'img')); S.extr.forEach(x=>{ fix(x.pago,'img'); fix(x.opReg,'img'); fix(x.compExt,'img'); });
  return subir;
}

/* ---- guardar: solo se envía lo que cambió ---- */
const RC_AREA_L = {rmv:'Operadores: movimientos y recargas', rex:'Extracciones', rag:'Agentes', rcf:'Configuración de operadores', rcu:'Cuadres y saldos', rfo:'Fondeos de extracciones', rlg:'Bitácora de acciones'};
const stageAdmin = () => LIVE && EMBED && SES && SES.rol==='ceo';
LV.pk = {}; LV.ev = '';
['input','change','keydown'].forEach(t=>document.addEventListener(t, e=>{ if(e.target && e.target.matches && e.target.matches('input,select,textarea')) LV.ev = 'campo'; }, true));
document.addEventListener('click', e=>{ if(e.target.closest('button,[data-act]')) LV.ev = 'boton'; }, true);
function guardarAccionAdmin(){
  const fotos = sacarFotos(); const R = toRecords(S), puts = [], dels = [];
  RCOLS.forEach(c=>{ const sn = LV.snap[c] = LV.snap[c]||{};
    Object.entries(R[c]).forEach(([id,v])=>{ const js = JSON.stringify(v); if(sn[id]===js) return; if(sn[id]===undefined && vacio(c,id,v)) return; if(LV.pk[c+'|'+id]===js) return; sn[id] = js; delete LV.pk[c+'|'+id]; puts.push({col:c, id, data:v}); });
    Object.keys(sn).forEach(id=>{ if(!(id in R[c]) && LV.pk[c+'|'+id]!=='__del'){ delete sn[id]; dels.push({col:c, id}); } }); });
  fotos.forEach(f=>encolar(async ()=>{ const j = await rcApi('foto.put', {id:f.id, data:f.data, col:'rmv'}); if(!j.ok) toast('No se guardó una foto: '+j.error, true); }));
  if(puts.length){ LV.batch = LV.batch.filter(b=>!puts.some(p=>p.col===b.col && p.id===b.id)).concat(puts); clearTimeout(LV.bt); LV.bt = setTimeout(enviarLote, 150); }
  dels.forEach(d=>encolar(async ()=>{ const j = await rcApi('del', d); if(!j.ok) toast('No se borró en Google Sheets: '+j.error, true); }));
}
function rcDiff(){ const R = toRecords(S), out = [];
  RCOLS.forEach(c=>{ const sn = LV.snap[c]||{};
    Object.entries(R[c]).forEach(([id,v])=>{ const js = JSON.stringify(v); if(sn[id]===js) return; if(sn[id]===undefined && vacio(c,id,v)) return; out.push({t:'put', col:c, id, area:RC_AREA_L[c]||c}); });
    Object.keys(sn).forEach(id=>{ if(!(id in R[c])) out.push({t:'del', col:c, id, area:RC_AREA_L[c]||c}); }); });
  return out; }
window.rcPendientes = () => { if(!LV.dirty) return []; if(!LV.dc) LV.dc = rcDiff(); if(!LV.dc.length) LV.dirty = false; return LV.dc; };
window.rcGuardar = async () => { LV.pk = {}; LV.forzar = true; try{ liveSave(); } finally { LV.forzar = false; } clearTimeout(LV.bt); enviarLote(); LV.dirty = false; LV.dc = null; syncPill(); await LV.q; };
window.rcRecargar = () => liveCargar(false);
window.rcDescartar = () => { LV.pk = {}; LV.dirty = false; LV.dc = null; LV.batch = []; liveCargar(false); };
function liveSave(){
  if(!LV.ready) return;
  if(stageAdmin() && !LV.forzar){
    if(LV.ev==='boton'){ guardarAccionAdmin(); }
    else { rcDiff().forEach(x=>{ LV.pk[x.col+'|'+x.id] = x.t==='del' ? '__del' : JSON.stringify(toRecords(S)[x.col][x.id]); }); }
    LV.dc = null; LV.dirty = rcDiff().length>0; syncPill(); try{ window.parent.rcAviso && window.parent.rcAviso(); }catch(e){} return; }
  const fotos = sacarFotos();
  const R = toRecords(S), puts = [], dels = [];
  RCOLS.forEach(c=>{ const sn = LV.snap[c] = LV.snap[c]||{};
    Object.entries(R[c]).forEach(([id,v])=>{ const js = JSON.stringify(v); if(sn[id]===js) return; if(sn[id]===undefined && vacio(c,id,v)) return; sn[id] = js; puts.push({col:c, id, data:v}); });
    Object.keys(sn).forEach(id=>{ if(!(id in R[c])){ delete sn[id]; dels.push({col:c, id}); } }); });
  if(!fotos.length && !puts.length && !dels.length) return;
  fotos.forEach(f=>encolar(async ()=>{ const j = await rcApi('foto.put', {id:f.id, data:f.data, col:'rmv'}); if(!j.ok) toast('No se guardó una foto: '+j.error, true); }));
  LV.batch = LV.batch.filter(b=>!puts.some(p=>p.col===b.col && p.id===b.id)).concat(puts);
  clearTimeout(LV.bt); LV.bt = setTimeout(enviarLote, 450);
  dels.forEach(d=>encolar(async ()=>{ const j = await rcApi('del', d); if(!j.ok) toast('No se borró en Google Sheets: '+j.error, true); }));
  syncPill();
}
function enviarLote(){
  const items = LV.batch; LV.batch = []; if(!items.length) return;
  encolar(async ()=>{ for(let i=0;i<items.length;i+=60){ const part = items.slice(i,i+60); const j = await rcApi('bulk', {items:part});
    if(!j.ok){ part.forEach(it=>{ if(LV.snap[it.col]) delete LV.snap[it.col][it.id]; }); toast('No se guardó en Google Sheets: '+j.error, true); break; } } });
}
function encolar(fn){ LV.inflight++; syncPill(); LV.q = LV.q.then(fn).catch(()=>{}).finally(()=>{ LV.inflight--; syncPill(); }); return LV.q; }
const liveBusy = () => LV.inflight>0 || LV.batch.length>0 || !!LV.dirty;
function syncPill(){ const el = document.getElementById('rcSync'); if(!el) return; if(LV.dirty){ el.className = 'pill warn'; el.textContent = 'Sin guardar · usa Guardar cambios arriba'; return; } const b = liveBusy(); el.className = 'pill '+(b?'warn':'ok'); el.textContent = b ? 'Guardando…' : 'Guardado ✓'; }
window.addEventListener('beforeunload', e=>{ if(LIVE && (LV.inflight>0 || LV.batch.length>0)){ enviarLote(); e.preventDefault(); e.returnValue=''; } });

function guardarRegistro(col, id){
  if(!LIVE) return save();
  const v = toRecords(S)[col][id]; if(v===undefined) return;
  LV.snap[col] = LV.snap[col]||{}; LV.snap[col][id] = JSON.stringify(v);
  encolar(async ()=>{ const j = await rcApi('bulk', {items:[{col, id, data:v}]}); if(!j.ok){ delete LV.snap[col][id]; toast('No se guardó en Google Sheets: '+j.error, true); } });
  LV.dc = null; if(LV.dirty && !rcDiff().length) LV.dirty = false; syncPill(); try{ window.parent.rcAviso && window.parent.rcAviso(); }catch(e){}
}

    <p class="muted" style="font-size:13px;margin:4px 0 12px">Sirven para verificar que cada transferencia de un agente llegó a una cuenta de BENDERAM.</p>
    <div class="tw" style="margin:0"><table class="t" style="min-width:620px"><thead><tr><th>Banco</th><th>N.º de cuenta</th><th>Titular</th><th></th></tr></thead><tbody>
    ${S.cuentas.map((c,i)=>`<tr><td><input data-cta="${i}" data-k="banco" list="bancosL3" value="${esc(c.banco)}"></td><td><input data-cta="${i}" data-k="numero" value="${esc(c.numero)}" inputmode="numeric"></td><td><input data-cta="${i}" data-k="titular" value="${esc(c.titular||'')}"></td><td><button class="btn sm quiet bad" data-act="delCta" data-i="${i}" aria-label="Quitar">🗑</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Sin cuentas.</td></tr>'}

}

/* ================== Contabilidad ================== */
const REV = {'':{l:'Por verificar', c:'warn'}, ok:{l:'Llegó al banco', c:'ok'}, bad:{l:'No llegó', c:'bad'}};
function contaRango(){ if(!UI.cDesde) UI.cDesde = todayS(); if(!UI.cHasta) UI.cHasta = todayS(); return [UI.cDesde, UI.cHasta]; }
function contaList(){ const [d,h] = contaRango(); return S.movs.filter(m=>m.tipo==='recarga' && m.fecha>=d && m.fecha<=h).sort((a,b)=>b.ts-a.ts); }
const bancoDe = (m) => m.verif===false ? -1 : S.cuentas.findIndex(c=>{ const a = norm(c.banco).replace(/^banco\s+(del?\s+)?/,''), b = norm(m.banco).replace(/^banco\s+(del?\s+)?/,''); return a && b && (a.includes(b) || b.includes(a)); });
function contaHTML(){
  if(RCM==='ext'){ const [d,h] = contaRango(); return `<div class="bar"><div class="f"><label for="cD">Desde</label><input id="cD" type="date" value="${d}" max="${todayS()}"></div><div class="f"><label for="cH">Hasta</label><input id="cH" type="date" value="${h}" max="${todayS()}"></div></div>` + contaExtrHTML(); }
  const [d,h] = contaRango(); const all = contaList(); const val = all.filter(m=>!m.anulado);
  if(!UI.cF) UI.cF = 'pend';
  const F = {pend:['Por verificar', m=>!m.anulado && !m.rev], ok:['Llegó al banco', m=>!m.anulado && m.rev==='ok'], bad:['No llegó', m=>!m.anulado && m.rev==='bad'], anul:['Anulados', m=>m.anulado], todos:['Todos', ()=>true]};
  const list = all.filter(F[UI.cF][1]);
  const sumF = f => r2(val.filter(f).reduce((a,m)=>a+m.monto,0));
  const porCta = S.cuentas.map((c,i)=>({c, i, tot:sumF(m=>bancoDe(m)===i), n:val.filter(m=>bancoDe(m)===i).length}));
  const otras = val.filter(m=>bancoDe(m)<0);
  const ck = i => `${i}|${d}|${h}`;
  return `<div class="bar">
    <div class="f"><label for="cD">Desde</label><input id="cD" type="date" value="${d}" max="${todayS()}"></div>
    <div class="f"><label for="cH">Hasta</label><input id="cH" type="date" value="${h}" max="${todayS()}"></div>
    <div style="flex:1"></div>
    <div class="acts"><button class="btn" data-act="xlsx">Descargar Excel</button></div></div>
  <section class="kpis">
    <div class="kpi hl"><small>Comprobantes recibidos</small><b class="num">${money(sumF(()=>true))}</b><em>${val.length} de todos los operadores</em></div>
    <div class="kpi"><small>Por verificar</small><b class="num ${val.filter(m=>!m.rev).length?'':'pos'}">${val.filter(m=>!m.rev).length}</b><em>${money(sumF(m=>!m.rev))}</em></div>
    <div class="kpi"><small>Llegaron al banco</small><b class="num pos">${val.filter(m=>m.rev==='ok').length}</b><em>${money(sumF(m=>m.rev==='ok'))}</em></div>
    <div class="kpi"><small>No llegaron</small><b class="num ${val.filter(m=>m.rev==='bad').length?'neg':''}">${val.filter(m=>m.rev==='bad').length}</b><em>${money(sumF(m=>m.rev==='bad'))}</em></div>
    <div class="kpi"><small>A cuenta ajena o fecha distinta</small><b class="num ${val.filter(m=>m.verif===false||(m.fechaComp&&m.fechaComp!==m.fecha)).length?'neg':''}">${val.filter(m=>m.verif===false||(m.fechaComp&&m.fechaComp!==m.fecha)).length}</b><em>Revisar con prioridad</em></div>
  </section>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2>Bandeja de comprobantes</h2>
    <div class="segf">${Object.entries(F).map(([k,[l,f]])=>`<button class="tab ${UI.cF===k?'on':''}" data-act="cF" data-k="${k}">${l} <span class="muted">${all.filter(f).length}</span></button>`).join('')}</div></div>
    <p class="muted" style="font-size:13px;margin:6px 0 0">Cada recarga que registra un operador llega aquí al instante. Compara con el estado de cuenta del banco y marca si el dinero llegó.</p></div>
  <div class="tw" style="margin-top:12px"><table class="t" style="min-width:1050px"><thead><tr><th>Recibido</th><th>Operador</th><th>Agente</th><th>Banco y comprobante</th><th>Depositante</th><th>Cuenta destino</th><th class="r">Monto</th><th>Estado</th><th>Foto</th><th></th></tr></thead><tbody>
  ${list.length?list.map(m=>{ const a = S.agentes.find(x=>x.id===m.agente)||{}; const r = m.anulado?{l:'Anulado', c:''}:REV[m.rev||'']; const fdis = m.fechaComp && m.fechaComp!==m.fecha;
    return `<tr class="${m.anulado?'anul':''}"><td class="num">${fd(m.fecha)}<small>${hm(m.ts)}</small></td><td>${esc(S.operadores.find(o=>o.id===m.op)?.nombre||'')}<small>${esc(m.usuario||'')}</small></td>
      <td><b>${esc(a.nombre||'—')}</b><small>${esc(a.cuenta||'')}</small></td>
      <td>${esc(m.banco)}<small class="num">${esc(m.comprobante)}${fdis?` · <span class="neg">fecha ${fd(m.fechaComp)}</span>`:''}</small></td>
      <td>${esc(m.nombre||'—')}</td>
      <td>${m.verif===false?`<span class="pill bad">${esc(m.cuentaDest)} ajena</span>`:m.verif?`<span class="pill ok">Empresa ✓</span>`:'<span class="muted">Sin dato</span>'}</td>
      <td class="r num"><b>${money(m.monto)}</b></td>
      <td><span class="pill ${r.c}">${r.l}</span>${m.rev==='bad'&&m.revMotivo?`<small>${esc(m.revMotivo)}</small>`:''}${m.revPor?`<small>${esc(m.revPor)}</small>`:''}</td>
      <td>${m.img?`<img class="thumb" src="${imgSrc(m.img)}" alt="Comprobante" data-act="ver" data-id="${m.id}">`:''}</td>
      <td>${m.anulado?'':!m.rev?`<div class="acts" style="flex-wrap:nowrap"><button class="btn sm gold" data-act="revOk" data-id="${m.id}">Llegó</button><button class="btn sm bad" data-act="revBad" data-id="${m.id}">No llegó</button></div>`:(isAdm()?`<button class="btn sm quiet" data-act="revUndo" data-id="${m.id}">Deshacer</button>`:'')}</td></tr>`; }).join('')
  : `<tr><td colspan="10" class="empty">${UI.cF==='pend'?'Todo está verificado en estas fechas. ✓':'Nada en este filtro.'}</td></tr>`}
  </tbody></table></div>
  ${RCM==='op'?'':contaExtrHTML()}
  <div class="c2">
    <section class="card"><h2>Conciliación por cuenta bancaria</h2><p class="muted" style="font-size:13px;margin:4px 0 12px">Escribe lo que muestra el estado de cuenta de cada banco en estas fechas. La diferencia sale sola.</p>
      <table class="cq"><tbody>${porCta.map(({c,i,tot,n})=>{ const v = S.conc[ck(i)]; const dif = v===''||v==null ? null : r2(+v - tot); return `<tr><td><b>${esc(c.banco)}</b> <span class="muted">····${esc(String(c.numero).slice(-4))}</span><br><small class="muted">${n} comprobantes · reportado ${money(tot)}</small></td>
        <td style="width:170px"><input data-conc="${ck(i)}" type="number" step="0.01" inputmode="decimal" value="${esc(v??'')}" placeholder="Según banco" aria-label="Total según estado de cuenta de ${esc(c.banco)}"><small class="${dif==null?'muted':Math.abs(dif)<0.005?'pos':'neg'}" style="display:block;margin-top:4px" id="cd-${i}">${dif==null?'—':Math.abs(dif)<0.005?'Cuadra ✓':`${dif<0?'Falta':'Sobra'} ${money(Math.abs(dif))}`}</small></td></tr>`; }).join('')}
      ${otras.length?`<tr><td colspan="2"><span class="neg"><b>${otras.length}</b> comprobantes a cuentas que no son de la empresa o de otros bancos: ${money(otras.reduce((a,m)=>a+m.monto,0))}</span></td></tr>`:''}</tbody></table>
    </section>
    <section class="card"><h2>Envío de reportes</h2>
      <p class="muted" style="font-size:13px;margin:4px 0 12px"><b>Excel:</b> en el panel real cada comprobante se guarda solo, como una fila nueva en la hoja <b>"Comprobantes"</b> de tu Google Sheet, y se puede descargar como Excel cuando quieras. Aquí lo pruebas con el botón <b>Descargar Excel</b>.</p>
      <h3 style="margin-top:6px">Telegram</h3>
      <div class="fg" style="margin-top:8px"><div class="f full"><label for="tgT">Token del bot</label><input id="tgT" data-tg="token" value="${esc(S.tg.token)}" placeholder="123456789:ABC..." autocomplete="off"></div>
      <div class="f full"><label for="tgC">ID del grupo o chat</label><input id="tgC" data-tg="chat" value="${esc(S.tg.chat)}" placeholder="-100123456789"></div></div>
      <label class="cbx"><input type="checkbox" data-tgc="cada" ${S.tg.cada?'checked':''}> Enviar cada comprobante con su foto</label>
      <label class="cbx"><input type="checkbox" data-tgc="alertas" ${S.tg.alertas?'checked':''}> Enviar alertas (no llegó al banco, cierres de caja con diferencia)</label>
      <div class="acts" style="margin-top:10px"><button class="btn" data-act="tgTest">Enviar mensaje de prueba</button><span class="muted" style="font-size:12.5px" id="tgSt">${S.tg.token&&S.tg.chat?'Configurado':'Sin configurar'}</span></div>
      <p class="muted" style="font-size:12.5px;margin:10px 0 0">En el panel real, el envío lo hace Google y el token no queda visible para nadie en el navegador.</p>
    </section>
  </div>`;
}
async function tgSend(text, kind, img){
  if(LIVE) return liveTg(text, kind, img);
  const t = S.tg; if(!t || !t.token || !t.chat) return false; if(kind==='comp' && !t.cada) return false; if(kind==='alertas' && !t.alertas) return false;
  const base = `https://api.telegram.org/bot${encodeURIComponent(t.token).replace('%3A',':')}`;
  try{
    let r;
    if(img){ const fdt = new FormData(); fdt.append('chat_id', t.chat); fdt.append('caption', text); fdt.append('parse_mode','HTML'); fdt.append('photo', await (await fetch(img)).blob(), 'comprobante.jpg'); r = await fetch(base+'/sendPhoto', {method:'POST', body:fdt}); }
    else r = await fetch(base+'/sendMessage', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({chat_id:t.chat, text, parse_mode:'HTML'})});
    const j = await r.json(); return !!j.ok;
  }catch(e){ return false; }
}
function tgComprobante(m){
  const a = S.agentes.find(x=>x.id===m.agente)||{};
  const txt = `💵 <b>Recarga ${money(m.monto)}</b>\n${esc(S.operadores.find(o=>o.id===m.op)?.nombre||'')} → ${esc(a.nombre||'')} (${esc(a.cuenta||'')})\n🏦 ${esc(m.banco)} · N.º ${esc(m.comprobante)}\n👤 ${esc(m.nombre||'—')}${m.verif===false?'\n⚠️ Cuenta destino NO es de la empresa':''}${m.fechaComp&&m.fechaComp!==m.fecha?`\n⚠️ Comprobante con fecha ${fd(m.fechaComp)}`:''}`;
  tgSend(txt, 'comp', m.img).then(ok=>{ if(ok){ m.tg = true; save(); } });
}
async function descargarExcel(){
  const [d,h] = contaRango(); const list = contaList();
  const rows = list.map(m=>{ const a = S.agentes.find(x=>x.id===m.agente)||{}; return {'Fecha':fd(m.fecha), 'Hora':hm(m.ts), 'Operador':S.operadores.find(o=>o.id===m.op)?.nombre||'', 'Usuario':m.usuario||'', 'Agente':a.nombre||'', 'Código agente':a.codigo||'', 'Cuenta plataforma':a.cuenta||'', 'Banco':m.banco, 'N.º comprobante':m.comprobante, 'Depositante':m.nombre, 'Fecha comprobante':m.fechaComp?fd(m.fechaComp):'', 'Cuenta destino':m.cuentaDest, 'Cuenta de la empresa':m.verif===false?'NO':m.verif?'Sí':'', 'Monto':m.monto, 'Estado contable':m.anulado?'Anulado':REV[m.rev||''].l, 'Motivo':m.anulado?(m.motivoAnul||''):(m.revMotivo||''), 'Verificado por':m.revPor||''}; });
  const conc = S.cuentas.map((c,i)=>{ const tot = r2(list.filter(m=>!m.anulado && bancoDe(m)===i).reduce((a,m)=>a+m.monto,0)); const v = S.conc[`${i}|${d}|${h}`]; return {'Banco':c.banco, 'Cuenta':c.numero, 'Reportado por operadores':tot, 'Según estado de cuenta':v===''||v==null?'':+v, 'Diferencia':v===''||v==null?'':r2(+v-tot)}; });
  const name = `comprobantes-${d}${h!==d?'_a_'+h:''}`;
  try{
    if(!window.XLSX) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(rows.length?rows:[{'Sin comprobantes':''}]); ws['!cols'] = Object.keys(rows[0]||{a:1}).map(k=>({wch:Math.max(10, k.length+2)}));
    XLSX.utils.book_append_sheet(wb, ws, 'Comprobantes'); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(conc), 'Conciliación'); const ex = extrRows(d,h); if(ex.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ex), 'Extracciones');
    XLSX.writeFile(wb, name+'.xlsx'); toast('Excel descargado.');
  }catch(e){
    const keys = Object.keys(rows[0]||{}); const csv = '﻿'+[keys, ...rows.map(r=>keys.map(k=>r[k]))].map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download = name+'.csv'; document.body.appendChild(a); a.click(); a.remove();
    toast('Se descargó en CSV (se abre con Excel).');
  }
}
document.addEventListener('click', async e=>{
  const b = e.target.closest('[data-act]'); if(!b) return; const a = b.dataset.act;
  if(a==='cF'){ UI.cF = b.dataset.k; render(); }
  else if(a==='xlsx') descargarExcel();
  else if(a==='revOk'){ const m = S.movs.find(x=>x.id===b.dataset.id); m.rev='ok'; m.revPor = SES.nombre; m.revEn = Date.now(); save(); render(); toast(`Comprobante ${m.comprobante} verificado.`); }
  else if(a==='revBad'){ const m = S.movs.find(x=>x.id===b.dataset.id); const mot = await ask('El dinero no llegó', `Comprobante <b>${esc(m.comprobante)}</b> de ${esc(m.banco)} por <b>${money(m.monto)}</b>. Gerencia recibirá la alerta.`, {input:'Ejemplo: no aparece en el estado de cuenta', ok:'Marcar como no llegó', danger:true}); if(!mot) return; m.rev='bad'; m.revMotivo = mot; m.revPor = SES.nombre; m.revEn = Date.now(); save(); render(); toast('Marcado. Aparece en las alertas de gerencia.', true);
    const ag = S.agentes.find(x=>x.id===m.agente)||{}; tgSend(`🚨 <b>Comprobante que NO llegó al banco</b>\n${esc(m.banco)} · N.º ${esc(m.comprobante)} · ${money(m.monto)}\nAgente: ${esc(ag.nombre||'')} · ${esc(S.operadores.find(o=>o.id===m.op)?.nombre||'')}\nMotivo: ${esc(mot)}`, 'alertas'); }
  else if(a==='revUndo' && !isAdm()){ toast('Solo gerencia puede cambiar una verificación.', true); }
  else if(a==='revUndo'){ const m = S.movs.find(x=>x.id===b.dataset.id); m.rev=''; delete m.revMotivo; delete m.revPor; save(); render(); }
  else if(a==='tgTest'){ const st = $('#tgSt'); if(!S.tg.token||!S.tg.chat){ toast('Escribe el token del bot y el ID del grupo.', true); return; } st.textContent = 'Enviando…'; const ok = await tgSend('✅ Prueba del panel BENDERAM: los comprobantes llegarán a este grupo.', 'test'); st.textContent = ok ? 'Mensaje enviado ✓' : 'No se pudo enviar. Revisa el token y el ID.'; }
});
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.dataset.conc){ S.conc[t.dataset.conc] = t.value; save(); const i = t.dataset.conc.split('|')[0]; const [d,h] = contaRango(); const tot = r2(contaList().filter(m=>!m.anulado && bancoDe(m)===+i).reduce((a,m)=>a+m.monto,0)); const el = document.getElementById('cd-'+i); if(el){ const dif = t.value===''?null:r2(+t.value-tot); el.className = dif==null?'muted':Math.abs(dif)<0.005?'pos':'neg'; el.textContent = dif==null?'—':Math.abs(dif)<0.005?'Cuadra ✓':`${dif<0?'Falta':'Sobra'} ${money(Math.abs(dif))}`; } }
  if(t.dataset.tg){ S.tg[t.dataset.tg] = t.value.trim(); save(); }
});
document.addEventListener('change', e=>{
  const t = e.target;
  if(t.dataset.tgc){ S.tg[t.dataset.tgc] = t.checked; save(); }
  if(t.id==='cD'){ UI.cDesde = t.value||todayS(); if(UI.cHasta<UI.cDesde) UI.cHasta = UI.cDesde; render(); }
  if(t.id==='cH'){ UI.cHasta = t.value||todayS(); if(UI.cHasta<UI.cDesde) UI.cDesde = UI.cHasta; render(); }
});

if(!LIVE && !S.movs.length && !S.demoHecho){ S.demoHecho = true; demoData(); }
try{ const th = localStorage.getItem('benderam-sim-theme'); if(th) document.documentElement.dataset.theme = th; }catch(e){}
if(LIVE) liveInit(); else render();
