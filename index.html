<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BENDERAM | Panel de personal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F1E6; --surface:#FFFFFF; --surface-2:#EFE8D8; --line:#E0D6C2; --line-2:#EAE2D1;
  --ink:#1E1910; --muted:#6C614D; --accent-text:#9A6B00; --gold:#F6B90A; --gold-ink:#1A1408;
  --danger:#C23A2F; --danger-bg:#FBE7E4; --ok:#1E8556; --ok-bg:#E2F3EA; --info:#2F67B0; --info-bg:#E4EDF8;
  --warn-bg:#FDF1CF; --chip:#E9E2D2; --shadow:0 18px 50px rgba(40,28,6,.18);
  --side:#0E0B07; --side-ink:#EDE3CF; --side-muted:#9D917A;
  --display:'Chakra Petch','Arial Narrow',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15120D; --surface:#1E1A13; --surface-2:#29231A; --line:#3A3226; --line-2:#2F291F;
    --ink:#F2EAD9; --muted:#A99C84; --accent-text:#F6B90A; --chip:#2F281D;
    --danger:#F07368; --danger-bg:#3A1C18; --ok:#5BCB95; --ok-bg:#16301F; --info:#86B5EC; --info-bg:#1A2737;
    --warn-bg:#3A2E10; --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15120D; --surface:#1E1A13; --surface-2:#29231A; --line:#3A3226; --line-2:#2F291F;
  --ink:#F2EAD9; --muted:#A99C84; --accent-text:#F6B90A; --chip:#2F281D;
  --danger:#F07368; --danger-bg:#3A1C18; --ok:#5BCB95; --ok-bg:#16301F; --info:#86B5EC; --info-bg:#1A2737;
  --warn-bg:#3A2E10; --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15}
h1{font-size:30px;font-weight:700;letter-spacing:.01em}
h2{font-size:18px;font-weight:600}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}

/* layout */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 16px 18px;border-right:1px solid #2A2216}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px 22px}
.brand img{width:62px;height:62px;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(246,185,10,.25))}
.brand b{display:block;font:700 21px/1 var(--display);letter-spacing:.04em;color:#FFD23F}
.brand span{font-size:12.5px;color:var(--side-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:#CFC3AB;font-weight:500;position:relative}
.nav button svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:#1C170F;color:#fff}
.nav button.on{background:#211A0E;color:#FFD23F}
.nav button.on::before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--gold)}
.nav button:focus-visible{outline:2px solid var(--gold)}
.nav .badge{margin-left:auto;background:#3A2C0C;color:#FFD23F;border-radius:20px;font-size:11.5px;padding:1px 8px;font-weight:600}
.ticket{margin-top:auto;background:var(--gold);color:var(--gold-ink);border-radius:10px;padding:14px 16px 14px;position:relative;
  -webkit-mask:radial-gradient(circle 9px at 0 62%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% 62%,transparent 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 9px at 0 62%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% 62%,transparent 98%,#000) right/51% 100% no-repeat}
.ticket small{display:block;font-size:12px;font-weight:600;opacity:.75}
.ticket .d{font:700 22px/1.1 var(--display);margin:2px 0 8px}
.ticket .a{font:700 26px/1 var(--display);border-top:1.5px dashed rgba(26,20,8,.4);padding-top:10px}
.ticket .c{font-size:12.5px;margin-top:4px;opacity:.8}
.ticket.empty .d{font-size:16px}
.store{font-size:11.5px;color:var(--side-muted);padding:12px 6px 0;line-height:1.4}

.main{padding:28px clamp(16px,3.2vw,40px) 60px;min-width:0}
.vh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.vh .sub{margin:6px 0 0;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.gold:hover{background:#FFC929}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.quiet{border-color:transparent;background:transparent}
.btn.quiet:hover{background:var(--surface-2)}
.btn.bad{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{all:unset;cursor:pointer;color:var(--accent-text);font-weight:600;font-size:14px}
.link:hover{text-decoration:underline}
.link:focus-visible{outline:2px solid var(--gold)}

/* strip */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:22px;overflow:hidden}
.strip>div{padding:16px 18px;border-right:1px solid var(--line-2)}
.strip>div:last-child{border-right:0}
.strip small{display:block;color:var(--muted);font-size:13px}
.strip b{display:block;font:700 26px/1.2 var(--display);margin-top:4px}
.strip em{font-style:normal;font-size:12.5px;color:var(--muted)}
.strip .hl b{color:var(--accent-text)}

.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}

/* payments list */
.pays{display:flex;flex-direction:column}
.pay{all:unset;cursor:pointer;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 6px;border-top:1px solid var(--line-2);border-radius:6px}
.pay:first-child{border-top:0}
.pay:hover{background:var(--surface-2)}
.pay:focus-visible{outline:2px solid var(--gold)}
.cal{border:1px solid var(--line);border-radius:8px;text-align:center;overflow:hidden;background:var(--bg)}
.cal b{display:block;font:700 20px/1.3 var(--display)}
.cal span{display:block;font-size:11px;background:var(--gold);color:var(--gold-ink);font-weight:700}
.cal.late span{background:var(--danger);color:#fff}
.pay .who b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pay .who small{color:var(--muted);font-size:12.5px}
.pay .amt{text-align:right}
.pay .amt b{display:block;font:600 16px var(--display)}

/* dept bars */
.bars{display:flex;flex-direction:column;gap:14px}
.bar-h{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px;gap:10px}
.bar{height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}

/* tabs / toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.tab span{color:var(--muted);font-size:12px}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab.on span{color:inherit;opacity:.7}
.search{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;min-width:240px}

/* table */
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.t td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.t .r{text-align:right}
.t td b{font-weight:600;white-space:nowrap}
.t td small{display:block;color:var(--muted);font-size:12.5px}
.t tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0;background:var(--surface-2)}
.t .proj{color:var(--muted);font-style:italic}
.rowacts{display:flex;gap:4px;justify-content:flex-end}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--chip);color:var(--muted)}
.pill.borrador{background:var(--warn-bg);color:var(--accent-text)}
.pill.aprobado{background:var(--info-bg);color:var(--info)}
.pill.pagado{background:var(--ok-bg);color:var(--ok)}
.pill.vencido{background:var(--danger-bg);color:var(--danger)}
.pill.pendiente{background:var(--warn-bg);color:var(--accent-text)}
.pill.aplicada{background:var(--ok-bg);color:var(--ok)}
.pill.inactivo{background:var(--chip);color:var(--muted)}

.monthnav{display:flex;align-items:center;gap:6px}
.monthnav b{font:600 20px var(--display);min-width:170px;text-align:center}

.empty{text-align:center;padding:48px 20px;background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.empty h2{margin-bottom:8px}
.empty p{color:var(--muted);margin:0 auto 18px;max-width:46ch}

/* overlay */
.ov{position:fixed;inset:0;background:rgba(14,11,7,.55);display:flex;justify-content:flex-end;z-index:50;animation:fade .15s ease-out}
.ov.center{justify-content:center;align-items:flex-start;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
@keyframes fade{from{opacity:0}}
.drawer{background:var(--surface);width:min(560px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow);display:flex;flex-direction:column;animation:slide .2s ease-out;padding-top:env(safe-area-inset-top,0px)}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.dh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.db{padding:20px 24px;flex:1}
.df{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface);padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.x{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:8px;font-size:22px;color:var(--muted)}
.x:hover{background:var(--surface-2)}
.x:focus-visible{outline:2px solid var(--gold)}
fieldset{border:0;padding:0;margin:0 0 22px}
legend{font:600 15px var(--display);margin-bottom:12px;padding:0}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fg .full{grid-column:1/-1}
.f label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px}
.f textarea{min-height:80px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:transparent}
.f .hint{font-size:12px;color:var(--muted);margin-top:4px}
.f .err{font-size:12.5px;color:var(--danger);margin-top:4px;display:none}
.f.bad input,.f.bad select{border-color:var(--danger)}
.f.bad .err{display:block}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:18px;height:18px;margin-top:2px;accent-color:#D19C00}
.calcbox{background:var(--warn-bg);border-radius:8px;padding:10px 12px;font-size:14px}

.modal{background:var(--surface);width:min(980px,100%);border-radius:14px;box-shadow:var(--shadow);animation:fade .2s ease-out}
.mbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:3;border-radius:14px 14px 0 0}
.mbar h2{display:flex;align-items:center;gap:10px}
.mscroll{padding:18px;background:var(--surface-2);border-radius:0 0 14px 14px}
.small-modal{width:min(440px,100%);padding:22px}
.small-modal p{color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-weight:600;font-size:14px;z-index:90;box-shadow:var(--shadow);animation:fade .15s}
.toast.err{background:var(--danger);color:#fff}

@media (max-width:1080px){.grid2{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px));z-index:20;gap:10px;border-right:0;border-bottom:1px solid #2A2216}
  .brand{padding:0}
  .brand img{width:42px;height:42px}
  .brand div{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:2px;scrollbar-width:none;min-width:0;flex:1}
  .nav button{padding:8px 10px;white-space:nowrap;font-size:14px;flex:none}
  .nav button.on::before{display:none}
  .nav .badge{display:none}
  .ticket,.store{display:none}
  .main{padding-top:20px}
  h1{font-size:25px}
  .fg{grid-template-columns:1fr}
  .search{min-width:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body{background:#fff}
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;left:0;top:0;width:100%;padding:0;background:#fff}
  .doc{border:0}
  .doc-in{border:0!important;background:none!important}
  .noprint{display:none!important}
}
</style>
</head>

<div class="app">
  <aside class="side">
    <div class="brand">
      <img id="logoSide" alt="BENDERAM">
      <div><b>BENDERAM</b><span>Panel de personal</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="Secciones"></nav>
    <div class="ticket" id="ticket"></div>
    <div class="store" id="storeNote"></div>
  </aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<div id="layer"></div>

function cedulaOK(c){
  if(!/^\d{10}$/.test(c)) return false;
  const p = +c.slice(0,2); if(!((p>=1&&p<=24)||p===30)) return false;
  if(+c[2] >= 6) return false;
  let s=0; for(let i=0;i<9;i++){ let v=+c[i]*(i%2===0?2:1); if(v>9) v-=9; s+=v; }
  return (10 - s%10)%10 === +c[9];
}

/* ---------- payroll logic ---------- */
const activeEmps = () => Object.values(S.emp).filter(e=>e.activo!==false).sort((a,b)=>a.nombre.localeCompare(b.nombre));
function adjustPay(d){
  if(!S.cfg.moverFinde) return d;
  const w = d.getDay();
  if(w===6) d.setDate(d.getDate()-1);
  if(w===0) d.setDate(d.getDate()-2);
  return d;
}
function periods(emp, ym){
  const [y,m] = ym.split('-').map(Number); const ld = lastDay(y,m); let out;
  if(emp.frecuencia==='quincenal'){
    out = [
      {n:1, desde:ymd(new Date(y,m-1,1)), hasta:ymd(new Date(y,m-1,15)), factor:.5, base:15},
      {n:2, desde:ymd(new Date(y,m-1,16)), hasta:ymd(new Date(y,m-1,ld)), factor:.5, base:15}
    ];
  } else {
    const dc = Math.max(1, Math.min(31, +emp.diaCorte || 30));
    const c = Math.min(dc, ld);
    const pm = new Date(y,m-2,1); const pc = Math.min(dc, lastDay(pm.getFullYear(), pm.getMonth()+1));
    out = [{n:1, desde:ymd(new Date(pm.getFullYear(), pm.getMonth(), pc+1)), hasta:ymd(new Date(y,m-1,c)), factor:1, base:30}];
  }
  out.forEach(p=>p.pago = ymd(adjustPay(pd(p.hasta))));
  return out.filter(p => !emp.fechaIngreso || emp.fechaIngreso <= p.hasta);
}
function prorate(emp,p){
  const full = r2((+emp.sueldo||0) * p.factor);
  if(emp.fechaIngreso && emp.fechaIngreso > p.desde){
    const days = Math.min(daysBetween(emp.fechaIngreso, p.hasta)+1, p.base);
    return {sueldo:r2((+emp.sueldo||0)/30*days), dias:days};
  }
  return {sueldo:full, dias:p.base};
}
const pendingMultas = (empId, hasta) => Object.values(S.mul).filter(m=>m.empId===empId && m.estado==='pendiente' && m.fecha<=hasta && (+m.monto||0)>0).sort((a,b)=>a.fecha.localeCompare(b.fecha));
function projection(emp,p){
  const {sueldo} = prorate(emp,p);
  const iess = emp.afiliado!==false ? r2(sueldo*(+S.cfg.iess||0)/100) : 0;
  const mul = sum(pendingMultas(emp.id,p.hasta).map(m=>m.monto));
  const desc = r2(iess+mul);
  return {ing:sueldo, desc, mul, neto:r2(sueldo-desc)};
}
function calc(r){
  const i=r.ing, d=r.desc, n=v=>Number(v)||0;
  const vh = n(r.sueldoMensual)/240;
  const hsup = r2(n(i.hsupH)*vh*1.5), hext = r2(n(i.hextH)*vh*2);
  const multas = sum((r.multas||[]).map(m=>m.monto));
  const base = n(i.sueldo)+hsup+hext+n(i.comisiones)+n(i.bonificaciones);
  const iess = r.afiliado ? r2(base*n(r.iessPct)/100) : 0;
  const totIng = r2(base + n(i.otrosIngresos) + n(i.otros));
  const totDesc = r2(iess + n(d.anticipos)+n(d.prestamos)+n(d.autorizados)+multas+n(d.otrosDesc)+n(d.otros));
  r.calc = {hsup, hext, multas, iess, totIng, totDesc, neto:r2(totIng-totDesc)};
  return r;
}
function rowsForMonth(ym){
  const rows=[];
  Object.values(S.emp).sort((a,b)=>a.nombre.localeCompare(b.nombre)).forEach(emp=>{
    periods(emp,ym).forEach(p=>{
      const id = `${emp.id}_${ym}_${p.n}`; const rol = S.rol[id];
      if(emp.activo===false && !rol) return;
      rows.push({emp,p,id,rol,ym});
    });
  });
  return rows.sort((a,b)=>a.p.pago.localeCompare(b.p.pago) || a.emp.nombre.localeCompare(b.emp.nombre));
}
const netOf = x => x.rol ? x.rol.calc.neto : projection(x.emp,x.p).neto;
function statusOf(x){
  if(!x.rol) return x.p.pago < todayS() ? {k:'vencido',t:'Sin generar, vencido'} : {k:'',t:'Sin generar'};
  const e = x.rol.estado;
  if(e==='pagado') return {k:'pagado',t:'Pagado'};
  if(x.rol.pago < todayS()) return {k:'vencido',t:e==='aprobado'?'Aprobado, vencido':'Borrador, vencido'};
  return e==='aprobado' ? {k:'aprobado',t:'Aprobado'} : {k:'borrador',t:'Borrador'};
}
function upcoming(limit){
  const ym = todayYM(); const t = todayS();
  const rows = [...rowsForMonth(addMonth(ym,-1)), ...rowsForMonth(ym), ...rowsForMonth(addMonth(ym,1))]
    .filter(x => !(x.rol && x.rol.estado==='pagado'))
    .filter(x => x.p.pago >= t || x.p.pago.slice(0,7) >= addMonth(ym,-1));
  return rows.sort((a,b)=>a.p.pago.localeCompare(b.p.pago)).slice(0,limit);
}
function nextPayFor(emp){
  const t = todayS();
  for(const ym of [todayYM(), addMonth(todayYM(),1)]){
    for(const p of periods(emp,ym)){
      const r = S.rol[`${emp.id}_${ym}_${p.n}`];
      if(p.pago >= t && !(r && r.estado==='pagado')) return p.pago;
    }
  }
  return null;
}
const nextNum = () => Object.values(S.rol).reduce((m,r)=>Math.max(m, +r.numero||0), 0) + 1;
function buildRol(emp, p, ym){
  const {sueldo,dias} = prorate(emp,p);
  const pend = pendingMultas(emp.id, p.hasta);
  const r = {
    id:`${emp.id}_${ym}_${p.n}`, numero:nextNum(), empId:emp.id, ym, n:p.n, frecuencia:emp.frecuencia||'mensual',
    desde:p.desde, hasta:p.hasta, pago:p.pago,
    e:{nombre:emp.nombre, cedula:emp.cedula, codigo:emp.codigo, cargo:emp.cargo, dept:emp.dept, fechaIngreso:emp.fechaIngreso, contrato:emp.contrato, formaPago:emp.formaPago, banco:emp.banco, cuenta:emp.cuenta},
    sueldoMensual:+emp.sueldo||0, afiliado:emp.afiliado!==false, iessPct:+S.cfg.iess||0,
    ing:{sueldo, dias, hsupH:0, hextH:0, comisiones:0, bonificaciones:0, otrosIngresos:0, otros:0},
    desc:{anticipos:0, prestamos:0, autorizados:0, otrosDesc:0, otros:0},
    multas: pend.map(snapMulta), obs: dias < p.base ? `Sueldo proporcional por ${dias} días laborados desde el ingreso.` : '',
    estado:'borrador', creado:new Date().toISOString()
  };
  return {r:calc(r), pend};
}
const snapMulta = m => ({id:m.id, tipo:m.tipo, fecha:m.fecha, motivo:m.motivo, monto:r2(m.monto)});
async function generate(rows){
  let n=0;
  for(const x of rows){
    if(S.rol[x.id]) continue;
    const {r,pend} = buildRol(x.emp, x.p, x.ym);
    await put('rol', r.id, r);
    for(const m of pend) await put('mul', m.id, {...m, estado:'aplicada', rolId:r.id});
    n++;
  }
  return n;
}

function openLayer(html, center){

}
function closeLayer(){ $('#layer').innerHTML=''; ED=null; document.body.style.overflow=''; if(pendingRender) render(); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && $('#layer').innerHTML) closeLayer(); });
$('#layer').addEventListener('mousedown', e=>{ if(e.target.matches('[data-ov]')) closeLayer(); });

function ask(title, msg, okLabel, danger){
  return new Promise(res=>{

let tt;
function toast(msg, err){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div'); t.className='toast'+(err?' err':''); t.setAttribute('role','status'); t.textContent=msg;

}

async function submitEmp(form){
  const id = form.dataset.id || uid('e');

  v.nombre=(v.nombre||'').trim().replace(/\s+/g,' '); v.correo=(v.correo||'').trim(); v.cedula=(v.cedula||'').trim(); v.cargo=(v.cargo||'').trim(); v.codigo=(v.codigo||'').trim();
  const errs = {};
  if(v.nombre.split(' ').length<2) errs.nombre='Escribe nombres y apellidos.';
  if(!cedulaOK(v.cedula)) errs.cedula='La cédula no es válida. Revisa los 10 dígitos.';
  else if(Object.values(S.emp).some(e=>e.cedula===v.cedula && e.id!==id)) errs.cedula='Ya existe un colaborador con esta cédula.';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.correo)) errs.correo='Escribe un correo válido, por ejemplo nombre@benderam.com.';
  if(!v.dept) errs.dept='Elige el departamento.';
  if(!v.cargo) errs.cargo='Escribe el cargo.';
  if(!v.codigo) errs.codigo='Escribe un código.';
  if(!v.fechaIngreso) errs.fechaIngreso='Elige la fecha de ingreso.';
  if(!(+v.sueldo>0)) errs.sueldo='Escribe el sueldo mensual.';
  if(v.frecuencia==='mensual' && !(+v.diaCorte>=1 && +v.diaCorte<=31)) errs.diaCorte='Usa un día entre 1 y 31.';
  form.querySelectorAll('.f[data-f]').forEach(f=>{ const k=f.dataset.f; f.classList.toggle('bad', !!errs[k]); const er=f.querySelector('.err'); if(er) er.textContent=errs[k]||''; });
  const firstBad = form.querySelector('.f.bad input,.f.bad select'); if(firstBad){ firstBad.focus(); return; }
  const prev = S.emp[id] || {};
  const data = {...prev, id, nombre:v.nombre, cedula:v.cedula, telefono:(v.telefono||'').trim(), correo:v.correo, dept:v.dept, cargo:v.cargo, codigo:v.codigo, fechaIngreso:v.fechaIngreso, contrato:v.contrato, sueldo:r2(v.sueldo), frecuencia:v.frecuencia, diaCorte:+v.diaCorte||30, afiliado:fd_.has('afiliado'), formaPago:v.formaPago, banco:(v.banco||'').trim(), cuenta:(v.cuenta||'').trim(), activo: form.dataset.id ? fd_.has('activo') : true, actualizado:new Date().toISOString()};
  if(!prev.creado) data.creado = data.actualizado;
  closeLayer(); await put('emp', id, data); render();
  toast(form.dataset.id ? 'Cambios guardados' : 'Colaborador guardado');
}

async function submitMul(form){
  const v = Object.fromEntries(new FormData(form).entries()); const errs={};
  const e = S.emp[v.empId];
  if(!e) errs.empId='Elige al colaborador.';
  if(!v.fecha) errs.fecha='Elige la fecha.';
  if(!(v.motivo||'').trim()) errs.motivo='Describe el motivo.';
  if((v.tipo==='multa'||v.tipo==='sancion') && !(+v.monto>0)) errs.monto='Escribe el valor a descontar.';
  if(v.tipo.startsWith('permiso') && !(+v.dias>0)) errs.dias='Escribe los días.';
  form.querySelectorAll('.f[data-f]').forEach(f=>{ const k=f.dataset.f; f.classList.toggle('bad',!!errs[k]); const er=f.querySelector('.err'); if(er) er.textContent=errs[k]||''; });
  const fb = form.querySelector('.f.bad input,.f.bad select,.f.bad textarea'); if(fb){ fb.focus(); return; }
  const id = form.dataset.id || uid('m');
  let monto=0, dias=null;
  if(v.tipo==='multa'||v.tipo==='sancion') monto = r2(v.monto);
  else { dias = +v.dias; if(v.tipo==='permiso_sin') monto = r2((+e.sueldo||0)/30*dias); }
  const data = {...(S.mul[id]||{}), id, empId:v.empId, tipo:v.tipo, fecha:v.fecha, motivo:v.motivo.trim(), monto, dias, estado: TIPOS[v.tipo].descuenta ? 'pendiente':'registrado', rolId:null, creado:(S.mul[id]&&S.mul[id].creado)||new Date().toISOString()};
  closeLayer(); await put('mul', id, data); render();
  const draft = Object.values(S.rol).find(r=>r.empId===data.empId && r.estado==='borrador' && r.desde<=data.fecha && data.fecha<=r.hasta);
  toast(data.estado==='pendiente' ? (draft?'Registrado. Abre el rol en borrador y usa "Actualizar multas" para incluirlo.':'Registrado. Se descontará en el próximo rol.') : 'Permiso registrado');
}

      <section class="doc-sec"><h4>DESCUENTOS / DEDUCCIONES</h4><table class="ln"><thead><tr><th>Concepto</th><th class="n">Valor</th></tr></thead><tbody>
        ${desRow(`Aporte IESS (${r.afiliado?NF.format(r.iessPct)+'%':'no afiliado'})`, o('iess'), true)}
        ${desRow('Anticipos', fld('desc.anticipos',d.anticipos))}
        ${desRow('Préstamos', fld('desc.prestamos',d.prestamos))}
        ${desRow('Descuentos autorizados', fld('desc.autorizados',d.autorizados))}
        ${desRow(`Multas y sanciones (${(r.multas||[]).length})`, o('multas'), true)}
        ${desRow('Otros descuentos', fld('desc.otrosDesc',d.otrosDesc))}
        ${desRow('Otros', fld('desc.otros',d.otros))}
        <tr class="tot"><td>TOTAL DESCUENTOS</td><td class="n">${o('totDesc')}</td></tr>
      </tbody></table></section>
    </div>
    <section class="doc-sec"><h4>RESUMEN DE REMUNERACIÓN</h4>
      <div class="doc-2e" style="padding:10px">
        <table class="kv"><tr><td class="k">TOTAL INGRESOS</td><td class="n" style="text-align:right">${o('totIng')}</td></tr><tr><td class="k">(−) TOTAL DESCUENTOS</td><td style="text-align:right">${o('totDesc')}</td></tr></table>
        <div class="doc-neto"><small>VALOR NETO A RECIBIR</small><small>Total ingresos − total descuentos</small><b>${o('neto')}</b></div>
      </div>
      <table class="kv kv4" style="border-top:1px solid #E3DACB"><tr><td class="k">Forma de pago:</td><td>${esc(r.e.formaPago)}</td><td class="k">Banco / institución:</td><td>${esc(r.e.banco)}</td></tr><tr><td class="k">Número de cuenta:</td><td colspan="3">${esc(r.e.cuenta)}</td></tr></table>
    </section>
    <section class="doc-sec"><h4>OBSERVACIONES</h4><div class="doc-obs">${ed?`<textarea class="doc-in" data-k="obs" placeholder="Notas para este rol">${esc(r.obs)}</textarea>`:esc(r.obs)}${mulList?`<div style="margin-top:6px"><b>Detalle de multas y sanciones descontadas:</b><ul>${mulList}</ul></div>`:''}</div></section>
    <div class="doc-sign">
      <div><b>FIRMA DEL TRABAJADOR</b><span>Recibí conforme</span><div style="height:46px"></div><div class="ln2">Nombre: ${esc(r.e.nombre)}<br>C.I.: ${esc(r.e.cedula)}</div></div>
      <div><b>${esc(c.razon||'BENDERAM S.A.S.')}</b><span>Responsable / gerencia</span><div style="height:46px"></div><div class="ln2">Nombre: ${esc(c.respNombre)}<br>Cargo: ${esc(c.respCargo)}<br>Sello:</div></div>
    </div>
  </div></article>`;
}

function rolModal(){
  const r = ED.r; const ed = r.estado==='borrador';
  const st = statusOf({rol:r, p:{pago:r.pago}});
  const pendNew = pendingMultas(r.empId, r.hasta).filter(m=>!r.multas.some(x=>x.id===m.id));
  let acts = '';
  if(r.estado==='borrador') acts = `<button class="btn quiet bad" data-act="rol-del">Eliminar</button>${pendNew.length?`<button class="btn" data-act="rol-refresh-mul">Actualizar multas (${pendNew.length})</button>`:''}<button class="btn" data-act="rol-save">Guardar borrador</button><button class="btn gold" data-act="rol-approve">Aprobar rol</button>`;
  else if(r.estado==='aprobado') acts = `<button class="btn quiet" data-act="rol-draft">Volver a borrador</button><button class="btn gold" data-act="rol-pay">Marcar como pagado</button>`;
  else acts = `<span class="muted" style="font-size:13px">Pagado el ${fd(r.pagadoEn)}</span><button class="btn quiet" data-act="rol-unpay">Deshacer pago</button>`;
  return `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="rolT">
    <div class="mbar"><h2 id="rolT">Rol N.º ${pad(r.numero,6)} <span class="pill ${st.k}">${st.t}</span></h2>
      <div class="acts">${acts}<button class="btn" data-act="rol-dl">Descargar</button><button class="btn" data-act="rol-print">Imprimir</button><button class="x" data-act="close" aria-label="Cerrar">×</button></div></div>
    <div class="mscroll" id="printArea">${docHTML(r, ed)}</div></div>`;
}
function openRol(id){
  const r = S.rol[id]; if(!r) return;
  ED = {r:JSON.parse(JSON.stringify(r)), orig:new Set((r.multas||[]).map(m=>m.id))};
  openLayer(rolModal(), true);
}
function refreshRolModal(){ const sc = $('.ov.center') ? $('.ov.center').scrollTop : 0; $('#layer .ov').innerHTML = rolModal(); $('.ov.center').scrollTop = sc; }
$('#layer').addEventListener('input', e=>{
  const t = e.target; if(!ED || !t.matches('.doc-in[data-k]')) return;
  const [a,b] = t.dataset.k.split('.');
  if(a==='obs') ED.r.obs = t.value; else ED.r[a][b] = t.value===''?0:r2(t.value);
  calc(ED.r);
  document.querySelectorAll('[data-o]').forEach(el=>el.textContent = money(ED.r.calc[el.dataset.o]));
});
async function saveRol(estado){
  const r = ED.r;
  if(estado) r.estado = estado;
  if(estado==='pagado') r.pagadoEn = todayS();
  if(estado==='aprobado') delete r.pagadoEn;
  calc(r); r.actualizado = new Date().toISOString();
  await put('rol', r.id, JSON.parse(JSON.stringify(r)));
  const now = new Set(r.multas.map(m=>m.id));
  for(const id of now) if(!ED.orig.has(id) && S.mul[id]) await put('mul', id, {...S.mul[id], estado:'aplicada', rolId:r.id});
  for(const id of ED.orig) if(!now.has(id) && S.mul[id]) await put('mul', id, {...S.mul[id], estado:'pendiente', rolId:null});
  ED.orig = now;
  render(); refreshRolModal();
}
async function payDirect(id){
  const r = S.rol[id]; if(!r) return;
  await put('rol', id, {...r, estado:'pagado', pagadoEn:todayS(), actualizado:new Date().toISOString()});
  render(); toast(`Rol de ${r.e.nombre} marcado como pagado`);
}
async function saveFile(filename, data){
  if(!downloads){ toast('La descarga no está disponible en esta vista.', true); return; }
  try{ await downloads.save({filename, data}); }catch(e){ if(e && e.code!=='declined') toast('No se pudo descargar el archivo.', true); }
}
const slug = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase();

/* ---------- actions ---------- */
const ACT = {
  nav:d=>{ UI.view=d.v; if(d.v==='roles'&&!UI.month) UI.month=todayYM(); render(); $('#main').focus({preventScroll:true}); window.scrollTo(0,0); },
  'goto-month':d=>{ UI.view='roles'; UI.month=d.ym; render(); window.scrollTo(0,0); },
  dept:d=>{ UI.dept=d.id; render(); },
  'new-emp':()=>empForm(),
  'edit-emp':d=>empForm(d.id),
  'del-emp':async d=>{ const e=S.emp[d.id]; if(!(await ask('Eliminar colaborador', `Se eliminará a ${e.nombre} y sus multas pendientes. Esta acción no se puede deshacer.`, 'Eliminar', true))) return;
    for(const m of Object.values(S.mul).filter(m=>m.empId===d.id && m.estado!=='aplicada')) await del('mul', m.id);
    closeLayer(); await del('emp', d.id); render(); toast('Colaborador eliminado'); },
  close:()=>closeLayer(),
  month:d=>{ UI.month = +d.k===0 ? todayYM() : addMonth(UI.month||todayYM(), +d.k); render(); },
  'gen-one':async d=>{ const x = rowsForMonth(d.ym).find(x=>x.id===d.id); if(!x) return; await generate([x]); render(); openRol(d.id); },
  'gen-all':async (d,b)=>{ b.disabled=true; const n = await generate(rowsForMonth(d.ym).filter(x=>!x.rol && x.emp.activo!==false)); render(); toast(`${n} ${n===1?'rol generado':'roles generados'} en borrador`); },
  'open-rol':d=>openRol(d.id),
  'pay-rol':d=>payDirect(d.id),
  'export-csv':d=>{
    const rows = rowsForMonth(d.ym);
    const q = v => `"${String(v??'').replace(/"/g,'""')}"`;
    const lines = [['N.º','Colaborador','Cédula','Departamento','Cargo','Desde','Hasta','Fecha de pago','Total ingresos','Aporte IESS','Multas y sanciones','Total descuentos','Neto','Estado','Banco','Cuenta'].map(q).join(';')];
    rows.forEach(x=>{ const v = x.rol?x.rol.calc:null; const p=projection(x.emp,x.p);
      lines.push([x.rol?pad(x.rol.numero,6):'',x.emp.nombre,x.emp.cedula,deptName(x.emp.dept),x.emp.cargo,fd(x.p.desde),fd(x.p.hasta),fd(x.p.pago), NF.format(v?v.totIng:p.ing), NF.format(v?v.iess:0), NF.format(v?v.multas:p.mul), NF.format(v?v.totDesc:p.desc), NF.format(v?v.neto:p.neto), statusOf(x).t, x.emp.banco, x.emp.cuenta].map(q).join(';')); });
    saveFile(`roles-de-pago-${d.ym}.csv`, '\ufeff'+lines.join('\r\n'));
  },
  'new-mul':d=>mulForm(d.emp),
  'edit-mul':d=>mulForm(null, d.id),
  'mul-f':d=>{ UI.mulF=d.id; render(); },
  'anular-mul':async d=>{ const m=S.mul[d.id]; if(!(await ask('Anular registro', 'Ya no se descontará en ningún rol. Quedará en el historial como anulado.', 'Anular', true))) return; await put('mul', d.id, {...m, estado:'anulada'}); render(); toast('Registro anulado'); },
  'del-mul':async d=>{ if(!(await ask('Eliminar registro', 'Se borrará del historial de forma definitiva.', 'Eliminar', true))) return; await del('mul', d.id); render(); toast('Registro eliminado'); },
  'rol-save':async ()=>{ await saveRol(); toast('Borrador guardado'); },
  'rol-approve':async ()=>{ await saveRol('aprobado'); toast('Rol aprobado'); },
  'rol-draft':async ()=>{ await saveRol('borrador'); toast('El rol volvió a borrador'); },
  'rol-pay':async ()=>{ await saveRol('pagado'); toast('Rol marcado como pagado'); },
  'rol-unpay':async ()=>{ await saveRol('aprobado'); toast('Pago deshecho; el rol queda aprobado'); },
  'rol-refresh-mul':()=>{ const add = pendingMultas(ED.r.empId, ED.r.hasta).filter(m=>!ED.r.multas.some(x=>x.id===m.id)); ED.r.multas.push(...add.map(snapMulta)); calc(ED.r); refreshRolModal(); toast(`${add.length} ${add.length===1?'multa agregada':'multas agregadas'}. Guarda para confirmar.`); },
  'rol-rm-mul':d=>{ ED.r.multas = ED.r.multas.filter(m=>m.id!==d.id); calc(ED.r); refreshRolModal(); },
  'rol-del':async ()=>{ const r=ED.r; if(!(await ask('Eliminar rol', `Se eliminará el rol N.º ${pad(r.numero,6)}. Sus multas vuelven a quedar pendientes de descuento.`, 'Eliminar rol', true))) return;
    for(const id of ED.orig) if(S.mul[id]) await put('mul', id, {...S.mul[id], estado:'pendiente', rolId:null});
    await del('rol', r.id); closeLayer(); render(); toast('Rol eliminado'); },
  'rol-print':()=>{ try{ window.print(); }catch(e){ toast('Usa Descargar y abre el archivo para imprimirlo.', true); } },
  'rol-dl':()=>{ const r=ED.r; calc(r);
    const html = `<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rol de pagos ${pad(r.numero,6)} ${esc(r.e.nombre)}</title><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Figtree:wght@400;600&display=swap" rel="stylesheet"><style>body{margin:0;padding:24px;background:#EFE8D8}${DOC_CSS}@media print{body{padding:0;background:#fff}.doc{border:0}}</style></head><body>${docHTML(r,false)}</body></html>`;
    saveFile(`rol-${pad(r.numero,6)}-${slug(r.e.nombre)}.html`, html); }
};
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const fn = ACT[b.dataset.act]; if(fn){ e.preventDefault(); fn(b.dataset, b, e); }
});
document.addEventListener('submit', e=>{
  e.preventDefault();
  if(e.target.id==='empForm') submitEmp(e.target);
  else if(e.target.id==='mulForm') submitMul(e.target);
  else if(e.target.id==='cfgForm'){ const f=new FormData(e.target); const v=Object.fromEntries(f.entries());
    const c = {...S.cfg, ...v, iess:r2(v.iess), moverFinde:f.has('moverFinde')};
    document.activeElement && document.activeElement.blur(); putCfg(c).then(()=>{ render(); toast('Datos de la empresa guardados'); }); }
});
document.addEventListener('input', e=>{ if(e.target.id==='q'){ UI.q=e.target.value; fillPersonal(); } });

/* ---------- boot ---------- */
async function boot(){
  render();
  let d=null;
  if(window.claude && typeof window.claude.use==='function'){
    try{ [d, downloads] = await Promise.all([window.claude.use('db'), window.claude.use('downloads')]); }catch(e){ d=null; }
  }
  if(d){
    db=d; mode='db';
    const seen = new Set(); const done = k=>{ seen.add(k); if(seen.size===4 && !UI.ready){ UI.ready=true; } render(); };
    for(const k of ['emp','mul','rol']){
      db.collection(COL[k]).onSnapshot(s=>{ S[k]=Object.fromEntries(s.docs.map(x=>[x.id,x.data()])); done(k); }, err=>{ toast('No se pudieron leer los datos: '+(err.message||err.code), true); done(k); });
    }
    db.doc('config/empresa').onSnapshot(s=>{ S.cfg={...DEF_CFG,...(s.exists?s.data():{})}; done('cfg'); }, ()=>done('cfg'));
  } else {
    loadLocal(); UI.ready=true; render();
  }
}
UI.month = todayYM();
boot();
</script>
