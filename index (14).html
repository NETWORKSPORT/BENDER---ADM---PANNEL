<style>
:root{
  --bg:#0D0A06; --bg-2:#14100A; --surface:#191409; --surface-2:#231C10; --surface-3:#2E2515; --line:#33291A; --line-2:#261F14;
  --ink:#F5ECD8; --muted:#A79A80; --accent-text:#FFC72C; --gold:#F6B90A; --gold-2:#FFD84A; --gold-ink:#1A1206;
  --glow:rgba(246,185,10,.18);
  --danger:#FF7A6B; --danger-bg:rgba(255,122,107,.13); --ok:#5FD49C; --ok-bg:rgba(95,212,156,.12);
  --info:#8DB8F2; --info-bg:rgba(141,184,242,.13); --warn-bg:rgba(246,185,10,.13); --chip:#2A2216;
  --shadow:0 24px 60px rgba(0,0,0,.55);
  --side:#080604; --side-ink:#EDE3CF; --side-muted:#8E8268; --side-hover:#17120A; --side-on:#21190B;
  --display:'Chakra Petch','Arial Narrow',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box; color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#F6F1E6; --bg-2:#EFE8D8; --surface:#FFFFFF; --surface-2:#F4EEE1; --surface-3:#EAE1CD; --line:#E0D6C2; --line-2:#ECE4D4;
  --ink:#1E1910; --muted:#6C614D; --accent-text:#946600; --gold:#F6B90A; --gold-2:#FFC929; --gold-ink:#1A1408;
  --glow:rgba(246,185,10,.22);
  --danger:#C23A2F; --danger-bg:#FBE7E4; --ok:#1E8556; --ok-bg:#E2F3EA; --info:#2F67B0; --info-bg:#E4EDF8; --warn-bg:#FDF1CF; --chip:#E9E2D2;
  --shadow:0 18px 50px rgba(40,28,6,.18); color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.12}
h1{font-size:34px;font-weight:700;letter-spacing:.01em}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.pos{color:var(--ok)} .neg{color:var(--danger)}

/* layout */
.app{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px 16px;border-right:1px solid #241C10;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px 18px}
.brand img{width:58px;height:58px;object-fit:contain;filter:drop-shadow(0 0 14px rgba(246,185,10,.35))}
.brand b{display:block;font:700 22px/1 var(--display);letter-spacing:.05em;color:#FFD23F}
.brand span{font-size:12.5px;color:var(--side-muted)}
.navg{font-size:12px;color:var(--side-muted);padding:14px 12px 6px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;color:#CFC3AB;font-weight:500;position:relative}
.nav button svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:var(--side-hover);color:#fff}
.nav button.on{background:var(--side-on);color:#FFD23F}
.nav button.on::before{content:"";position:absolute;left:-14px;top:7px;bottom:7px;width:4px;border-radius:0 4px 4px 0;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.nav button:focus-visible{outline:2px solid var(--gold)}
.nav .badge{margin-left:auto;background:#3A2C0C;color:#FFD23F;border-radius:20px;font-size:11.5px;padding:1px 8px;font-weight:600}
.nav .badge.red{background:#4A1A14;color:#FF9A8C}
.sidefoot{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:10px}
.store{font-size:11.5px;color:var(--side-muted);padding:0 6px;line-height:1.4}
.themebtn{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--side-muted);padding:6px;border-radius:6px}
.themebtn:hover{color:#fff}
.themebtn:focus-visible{outline:2px solid var(--gold)}

.main{padding:28px clamp(16px,3.2vw,44px) 70px;min-width:0}
.vh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.vh .sub{margin:6px 0 0;color:var(--muted);max-width:70ch}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:16px;padding:26px 28px;margin-bottom:22px;background:
  radial-gradient(600px 260px at 88% -20%,rgba(246,185,10,.28),transparent 70%),
  radial-gradient(500px 240px at -10% 120%,rgba(246,185,10,.12),transparent 70%),
  linear-gradient(135deg,#17110A,#0B0805);color:#F5ECD8;border:1px solid #3A2D14}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,216,74,.035) 0 2px,transparent 2px 22px);pointer-events:none}
.hero-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:flex-start;position:relative;z-index:1}
.hero h1{font-size:clamp(28px,3.6vw,44px);color:#fff}
.hero .sub{color:#C9BC9F;margin-top:6px}
.hero-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:14px;margin-top:22px;position:relative;z-index:1}
.htile{background:rgba(255,255,255,.04);border:1px solid rgba(255,216,74,.16);border-radius:12px;padding:16px 18px;min-width:0}
.htile small{display:block;color:#BBAE92;font-size:13px}
.htile .big{font:700 30px/1.15 var(--display);color:#fff;margin-top:4px}
.htile .gold{color:#FFD23F}
.htile p{margin:6px 0 0;font-size:13.5px;color:#C9BC9F}
.htile.ticket{background:linear-gradient(135deg,#FFD84A,#F6B90A 55%,#D99A00);color:#1A1206;border:0}
.htile.ticket small,.htile.ticket p{color:rgba(26,18,6,.75)}
.htile.ticket .big{color:#1A1206;font-size:34px}
.htile .lnk{all:unset;cursor:pointer;font-weight:600;font-size:13.5px;color:#FFD23F;margin-top:8px;display:inline-block}
.htile.ticket .lnk{color:#1A1206;text-decoration:underline}
.htile .lnk:focus-visible{outline:2px solid #fff}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.gold{background:linear-gradient(180deg,var(--gold-2),var(--gold));border-color:var(--gold);color:var(--gold-ink);box-shadow:0 0 0 0 var(--glow)}
.btn.gold:hover{box-shadow:0 0 18px var(--glow)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.quiet{border-color:transparent;background:transparent}
.btn.quiet:hover{background:var(--surface-2)}
.btn.bad{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{all:unset;cursor:pointer;color:var(--accent-text);font-weight:600;font-size:14px}
.link:hover{text-decoration:underline}
.link:focus-visible{outline:2px solid var(--gold)}

/* strip */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:22px;overflow:hidden}
.strip>div{padding:16px 18px;border-right:1px solid var(--line-2)}
.strip>div:last-child{border-right:0}
.strip small{display:block;color:var(--muted);font-size:13px}
.strip b{display:block;font:700 26px/1.2 var(--display);margin-top:4px}
.strip em{font-style:normal;font-size:12.5px;color:var(--muted)}
.strip .hl b{color:var(--accent-text)}

.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.stack{display:flex;flex-direction:column;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.note{background:var(--warn-bg);border:1px solid rgba(246,185,10,.35);border-radius:10px;padding:12px 14px;margin-bottom:18px;font-size:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* list rows */
.pays{display:flex;flex-direction:column}
.pay{all:unset;cursor:pointer;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 6px;border-top:1px solid var(--line-2);border-radius:6px}
.pay:first-child{border-top:0}
.pay:hover{background:var(--surface-2)}
.pay:focus-visible{outline:2px solid var(--gold)}
.cal{border:1px solid var(--line);border-radius:8px;text-align:center;overflow:hidden;background:var(--bg-2)}
.cal b{display:block;font:700 20px/1.3 var(--display)}
.cal span{display:block;font-size:11px;background:var(--gold);color:var(--gold-ink);font-weight:700}
.cal.late span{background:var(--danger);color:#fff}
.cal.pink span{background:#E86FA8;color:#fff}
.pay .who b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pay .who small{color:var(--muted);font-size:12.5px}
.pay .amt{text-align:right}
.pay .amt b{display:block;font:600 16px var(--display)}

.bars{display:flex;flex-direction:column;gap:13px}
.bar-h{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px;gap:10px}
.bar{height:8px;background:var(--surface-3);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--gold)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}

/* tabs / toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;font-weight:500;display:inline-flex;gap:6px;align-items:center;color:var(--ink)}
.tab span{color:var(--muted);font-size:12px}
.tab.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.tab.on span{color:inherit;opacity:.7}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface);margin-bottom:18px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:7px 14px;border-radius:7px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface-3);color:var(--ink)}
.seg button:focus-visible{outline:2px solid var(--gold)}
.search{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;min-width:240px;color:var(--ink)}

/* table */
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.t td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr:hover td{background:var(--surface-2)}
.t .r{text-align:right}
.t td b{font-weight:600;white-space:nowrap}
.t td small{display:block;color:var(--muted);font-size:12.5px}
.t tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0;background:var(--surface-2)}
.t .proj{color:var(--muted);font-style:italic}
.t tr.click{cursor:pointer}
.rowacts{display:flex;gap:4px;justify-content:flex-end}
.prog{display:flex;align-items:center;gap:8px;min-width:110px}
.prog .bar{flex:1;height:6px}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--chip);color:var(--muted)}
.pill.borrador,.pill.pendiente,.pill.abierto,.pill.tramite{background:var(--warn-bg);color:var(--accent-text)}
.pill.aprobado,.pill.cerrado,.pill.info{background:var(--info-bg);color:var(--info)}
.pill.pagado,.pill.aplicada,.pill.ok,.pill.revisado,.pill.activa{background:var(--ok-bg);color:var(--ok)}
.pill.vencido,.pill.bad,.pill.suspendida{background:var(--danger-bg);color:var(--danger)}
.pill.inactivo,.pill.cerrada{background:var(--chip);color:var(--muted)}

.monthnav{display:flex;align-items:center;gap:6px}
.monthnav b{font:600 20px var(--display);min-width:180px;text-align:center}

.empty{text-align:center;padding:48px 20px;background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.empty h2{margin-bottom:8px}
.empty p{color:var(--muted);margin:0 auto 18px;max-width:50ch}

/* birthdays */
.bday-hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.bday-big{font:700 64px/1 var(--display);color:#FFD23F;text-shadow:0 0 24px rgba(246,185,10,.4)}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.month{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.month.now{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.month h3{display:flex;justify-content:space-between;margin-bottom:8px}
.month ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.month li{display:flex;gap:10px;align-items:baseline}
.month li b{font:600 14px var(--display);min-width:22px;color:var(--accent-text)}
.month li.past{opacity:.5}

/* cash matrix */
.matrix td.cell{padding:0}
.matrix .cbtn{all:unset;cursor:pointer;display:block;padding:10px 12px;text-align:right;font-variant-numeric:tabular-nums;min-width:120px}
.matrix .cbtn:hover{background:var(--surface-2)}
.matrix .cbtn:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.matrix .cbtn small{display:block;font-size:11.5px;color:var(--muted)}
.matrix tr.wk td{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
.matrix tr.today td{box-shadow:inset 0 0 0 9999px rgba(246,185,10,.07)}
.matrix td.day{white-space:nowrap}
.cz{color:var(--ok)} .cf{color:var(--danger)} .cs{color:var(--info)} .cp{color:var(--muted)}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* overlay */
.ov{position:fixed;inset:0;background:rgba(5,4,2,.7);backdrop-filter:blur(3px);display:flex;justify-content:flex-end;z-index:50;animation:fade .15s ease-out}
.ov.center{justify-content:center;align-items:flex-start;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
@keyframes fade{from{opacity:0}}
.drawer{background:var(--surface);width:min(600px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow);display:flex;flex-direction:column;animation:slide .2s ease-out;padding-top:env(safe-area-inset-top,0px);border-left:1px solid var(--line)}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.dh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.db{padding:20px 24px;flex:1}
.df{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface);padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.x{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:8px;font-size:22px;color:var(--muted)}
.x:hover{background:var(--surface-2)}
.x:focus-visible{outline:2px solid var(--gold)}
fieldset{border:0;padding:0;margin:0 0 22px}
legend{font:600 15px var(--display);margin-bottom:12px;padding:0;color:var(--accent-text)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fg3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fg .full,.fg3 .full{grid-column:1/-1}
.f label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--bg-2);border-radius:8px;padding:9px 11px;color:var(--ink)}
.f textarea{min-height:80px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:transparent}
.f .hint{font-size:12px;color:var(--muted);margin-top:4px}
.f .err{font-size:12.5px;color:var(--danger);margin-top:4px;display:none}
.f.bad input,.f.bad select,.f.bad textarea{border-color:var(--danger)}
.f.bad .err{display:block}
.f.warn input,.f.warn select{border-color:rgba(246,185,10,.6)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:#D19C00;flex:none}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calcbox{background:var(--warn-bg);border-radius:8px;padding:10px 12px;font-size:14px}

.modal{background:var(--surface);width:min(1000px,100%);border-radius:14px;box-shadow:var(--shadow);animation:fade .2s ease-out;border:1px solid var(--line)}
.mbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:3;border-radius:14px 14px 0 0}
.mbar h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mscroll{padding:18px;background:var(--bg-2);border-radius:0 0 14px 14px}
.small-modal{width:min(460px,100%);padding:22px}
.small-modal p{color:var(--muted)}

/* cash form */
.cash{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:20px}
.cash .panel{padding:14px 16px}
.cash table{width:100%;border-collapse:collapse;font-size:14px}
.cash td{padding:5px 0;border-bottom:1px solid var(--line-2)}
.cash td.r{text-align:right;width:140px}
.cash td.q{width:90px}
.cash tr.tot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0;padding-top:8px}
.cash input{width:100%;border:1px solid var(--line);background:var(--bg-2);border-radius:6px;padding:6px 8px;text-align:right;color:var(--ink)}
.cash input:focus{outline:2px solid var(--gold);border-color:transparent}
.verdict{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr) 1.3fr;gap:0;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.verdict>div{padding:14px 16px;background:var(--surface);border-right:1px solid var(--line-2)}
.verdict small{display:block;color:var(--muted);font-size:13px}
.verdict b{display:block;font:700 24px/1.2 var(--display)}
.verdict .res{background:var(--surface-3)}
.verdict .res.ok{background:var(--ok-bg)} .verdict .res.ok b{color:var(--ok)}
.verdict .res.bad{background:var(--danger-bg)} .verdict .res.bad b{color:var(--danger)}
.verdict .res.over{background:var(--info-bg)} .verdict .res.over b{color:var(--info)}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-weight:600;font-size:14px;z-index:90;box-shadow:var(--shadow);animation:fade .15s;max-width:calc(100% - 32px)}
.toast.err{background:var(--danger);color:#fff}
.list-edit{display:flex;flex-direction:column;gap:8px}
.list-edit .le{display:grid;grid-template-columns:1fr 150px 110px auto;gap:8px;align-items:center}
.list-edit input,.list-edit select{width:100%;border:1px solid var(--line);background:var(--bg-2);border-radius:8px;padding:8px 10px;color:var(--ink)}
.oblig{display:flex;flex-direction:column}
.oblig>div{display:grid;grid-template-columns:70px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--line-2)}
.oblig>div:first-child{border-top:0}
.recos{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.reco{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.reco h3{margin-bottom:6px;color:var(--accent-text)}
.reco p{margin:0;color:var(--muted);font-size:14px}


.subnav{margin-bottom:20px}
.t th small{display:block;color:var(--muted)}
.sbadge{display:inline-block;margin-left:6px;background:var(--gold);color:var(--gold-ink);border-radius:20px;font-size:11.5px;padding:0 7px;font-weight:700;line-height:18px}
.sbadge.mute{background:var(--surface-3);color:var(--muted)}
.tag{display:inline-block;font:600 12.5px var(--display);letter-spacing:.04em;padding:2px 8px;border-radius:6px;background:var(--warn-bg);color:var(--accent-text);border:1px solid rgba(246,185,10,.35);white-space:nowrap}
.scan{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin-bottom:16px}
.scan svg{width:24px;height:24px;flex:none;stroke:var(--accent-text);fill:none;stroke-width:1.7;stroke-linecap:round}
.scan .search{flex:1;border:0;background:transparent;min-width:0;font-size:15px;padding:8px 4px}
.scan .search:focus{outline:none}
.scan:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px var(--glow)}
.scan .muted{font-size:12.5px;white-space:nowrap}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column}
.pc-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}
.pc-h b{font:700 22px var(--display);color:var(--accent-text)}
.pcard ul{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:2px}
.lrow{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:5px 6px;border-radius:6px;font-size:14px;width:calc(100% - 12px)}
.lrow:hover{background:var(--surface-2)}
.lrow:focus-visible{outline:2px solid var(--gold)}
.pcard .acts{margin-top:auto}
.cash input[list],.cash .minisel{text-align:left;width:100%;border:1px solid var(--line);background:var(--bg-2);border-radius:6px;padding:6px 8px;color:var(--ink)}
.cash table td{padding-right:6px}
@media (max-width:860px){.scan .muted{display:none}.list-edit .le{grid-template-columns:1fr 1fr!important}}
@media (max-width:1180px){.grid2,.grid3{grid-template-columns:1fr}.hero-grid{grid-template-columns:1fr 1fr}.hero-grid .ticket{grid-column:1/-1}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px));z-index:20;gap:10px;border-right:0;border-bottom:1px solid #241C10;overflow:visible}
  .brand{padding:0}.brand img{width:40px;height:40px}.brand div{display:none}
  .navwrap{display:flex;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
  .navg{display:none}
  .nav{flex-direction:row;gap:2px}
  .nav button{padding:8px 10px;white-space:nowrap;font-size:14px;flex:none}
  .nav button.on::before{display:none}
  .nav .badge{display:none}
  .sidefoot{display:none}
  .main{padding-top:20px}
  h1{font-size:26px}
  .fg,.fg3,.checks,.cash{grid-template-columns:1fr}
  .verdict{grid-template-columns:1fr 1fr}
  .hero{padding:20px}.hero-grid{grid-template-columns:1fr}
  .search{min-width:0;width:100%}
  .list-edit .le{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body{background:#fff}
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;left:0;top:0;width:100%;padding:0;background:#fff}
  .doc{border:0}
  .doc-in{border:0!important;background:none!important}
  .noprint{display:none!important}
}
</style>

/* ================= utilidades ================= */
function clone(o){ return JSON.parse(JSON.stringify(o)); }
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = n => Math.round((Number(n)||0)*100)/100;
const NF = new Intl.NumberFormat('es-EC',{minimumFractionDigits:2,maximumFractionDigits:2});
const NF0 = new Intl.NumberFormat('es-EC',{maximumFractionDigits:0});
const money = n => (r2(n)<0?'−$':'$') + NF.format(Math.abs(r2(n)));
const moneyK = n => Math.abs(n)>=10000 ? (n<0?'−$':'$')+NF0.format(Math.abs(n)/1000)+' mil' : money(n);
const sum = a => r2(a.reduce((x,y)=>x+(Number(y)||0),0));
const pad = (n,l=2) => String(n).padStart(l,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d||1); };
const fd = s => s ? s.split('-').reverse().join('/') : '—';
const todayS = () => ymd(new Date());
const todayYM = () => todayS().slice(0,7);
const addMonth = (ym,k) => { const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+k,1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const monthLabel = ym => cap(new Intl.DateTimeFormat('es-EC',{month:'long',year:'numeric'}).format(pd(ym+'-01')));
const monthName = m => cap(new Intl.DateTimeFormat('es-EC',{month:'long'}).format(new Date(2026,m,1)));
const shortMonth = s => new Intl.DateTimeFormat('es-EC',{month:'short'}).format(pd(s)).replace('.','');
const dayMonth = s => new Intl.DateTimeFormat('es-EC',{day:'numeric',month:'short'}).format(pd(s)).replace('.','');
const longDay = s => cap(new Intl.DateTimeFormat('es-EC',{weekday:'short',day:'numeric',month:'short'}).format(pd(s)).replace(/\./g,''));
const wd = s => cap(new Intl.DateTimeFormat('es-EC',{weekday:'short'}).format(pd(s)).replace('.',''));
const daysBetween = (a,b) => Math.round((pd(b)-pd(a))/864e5);
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const lastDay = (y,m) => new Date(y,m,0).getDate();
const firstName = n => String(n||'').split(' ')[0];
const shortName = n => { const p=String(n||'').split(' '); return p.length>=3 ? `${p[0]} ${p[p.length>=4?2:1]}` : n; };
function cedulaOK(c){
  if(!/^\d{10}$/.test(c)) return false;
  const p = +c.slice(0,2); if(!((p>=1&&p<=24)||p===30)) return false;
  if(+c[2] >= 6) return false;
  let s=0; for(let i=0;i<9;i++){ let v=+c[i]*(i%2===0?2:1); if(v>9) v-=9; s+=v; }
  return (10 - s%10)%10 === +c[9];
}
function waLink(phone, text){
  let d = String(phone||'').replace(/\D/g,''); if(!d) return null;
  if(d.startsWith('0')) d = '593'+d.slice(1); else if(d.length===9) d='593'+d;
  return `https://wa.me/${d}?text=${encodeURIComponent(text)}`;
}

/* ================= almacenamiento ================= */
function loadLocal(){
  try{ const d = JSON.parse(localStorage.getItem(LKEY)||'null');
    if(d){ KEYS.forEach(k=>S[k]=d[k]||{}); S.cfg = {...clone(DEF_CFG), ...(d.cfg||{})}; } }catch(e){}
}
function saveLocal(){ try{ const o={cfg:S.cfg}; KEYS.forEach(k=>o[k]=S[k]); localStorage.setItem(LKEY, JSON.stringify(o)); }catch(e){ toast('El navegador no permitió guardar. Descarga una copia de respaldo.', true); } }
function fail(e){
  const code = e && e.code;
  toast(code==='not_granted' ? 'Tu acceso a este panel es de solo lectura.' : 'No se guardó el cambio. ' + (e && e.message ? e.message : 'Inténtalo de nuevo.'), true);
}
async function put(k,id,data){
  S[k][id] = data;
  if(mode==='db'){ try{ await db.collection(COL[k]).doc(id).set(data); }catch(e){ fail(e); } }
  else saveLocal();
}
async function del(k,id){
  delete S[k][id];
  if(mode==='db'){ try{ await db.collection(COL[k]).doc(id).delete(); }catch(e){ fail(e); } }
  else saveLocal();
}
async function putCfg(c){
  S.cfg = c;
  if(mode==='db'){ try{ await db.doc('config/empresa').set(c); }catch(e){ fail(e); } }
  else saveLocal();
}

/* ================= nómina ================= */
const activeEmps = () => Object.values(S.emp).filter(e=>e.activo!==false).sort((a,b)=>a.nombre.localeCompare(b.nombre));
const payable = e => e.activo!==false && (+e.sueldo||0) > 0;
function adjustPay(d){
  if(!S.cfg.moverFinde) return d;
  const w = d.getDay();
  if(w===6) d.setDate(d.getDate()-1);
  if(w===0) d.setDate(d.getDate()-2);
  return d;
}
function periods(emp, ym){
  const [y,m] = ym.split('-').map(Number); const ld = lastDay(y,m); let out;
  if(emp.frecuencia==='quincenal'){
    out = [
      {n:1, desde:ymd(new Date(y,m-1,1)), hasta:ymd(new Date(y,m-1,15)), factor:.5, base:15},
      {n:2, desde:ymd(new Date(y,m-1,16)), hasta:ymd(new Date(y,m-1,ld)), factor:.5, base:15}
    ];
  } else {
    const dc = Math.max(1, Math.min(31, +emp.diaCorte || 30));
    const c = Math.min(dc, ld);
    const pm = new Date(y,m-2,1); const pc = Math.min(dc, lastDay(pm.getFullYear(), pm.getMonth()+1));
    out = [{n:1, desde:ymd(new Date(pm.getFullYear(), pm.getMonth(), pc+1)), hasta:ymd(new Date(y,m-1,c)), factor:1, base:30}];
  }
  out.forEach(p=>p.pago = ymd(adjustPay(pd(p.hasta))));
  return out.filter(p => !emp.fechaIngreso || emp.fechaIngreso <= p.hasta);
}
function prorate(emp,p){
  const full = r2((+emp.sueldo||0) * p.factor);
  if(emp.fechaIngreso && emp.fechaIngreso > p.desde){
    const days = Math.min(daysBetween(emp.fechaIngreso, p.hasta)+1, p.base);
    return {sueldo:r2((+emp.sueldo||0)/30*days), dias:days};
  }
  return {sueldo:full, dias:p.base};
}
const pendingMultas = (empId, hasta) => Object.values(S.mul).filter(m=>m.empId===empId && m.estado==='pendiente' && m.fecha<=hasta && (+m.monto||0)>0).sort((a,b)=>a.fecha.localeCompare(b.fecha));
function projection(emp,p){
  const {sueldo} = prorate(emp,p);
  const iess = emp.afiliado!==false ? r2(sueldo*(+S.cfg.iess||0)/100) : 0;
  const mul = sum(pendingMultas(emp.id,p.hasta).map(m=>m.monto));
  const desc = r2(iess+mul);
  return {ing:sueldo, desc, mul, neto:r2(sueldo-desc)};
}
function calc(r){
  const i=r.ing, d=r.desc, n=v=>Number(v)||0;
  const vh = n(r.sueldoMensual)/240;
  const hsup = r2(n(i.hsupH)*vh*1.5), hext = r2(n(i.hextH)*vh*2);
  const multas = sum((r.multas||[]).map(m=>m.monto));
  const base = n(i.sueldo)+hsup+hext+n(i.comisiones)+n(i.bonificaciones);
  const iess = r.afiliado ? r2(base*n(r.iessPct)/100) : 0;
  const totIng = r2(base + n(i.otrosIngresos) + n(i.otros));
  const totDesc = r2(iess + n(d.anticipos)+n(d.prestamos)+n(d.autorizados)+multas+n(d.otrosDesc)+n(d.otros));
  r.calc = {hsup, hext, multas, iess, totIng, totDesc, neto:r2(totIng-totDesc)};
  return r;
}
function rowsForMonth(ym){
  const rows=[];
  Object.values(S.emp).sort((a,b)=>a.nombre.localeCompare(b.nombre)).forEach(emp=>{
    periods(emp,ym).forEach(p=>{
      const id = `${emp.id}_${ym}_${p.n}`; const rol = S.rol[id];
      if(!payable(emp) && !rol) return;
      rows.push({emp,p,id,rol,ym});
    });
  });
  return rows.sort((a,b)=>a.p.pago.localeCompare(b.p.pago) || a.emp.nombre.localeCompare(b.emp.nombre));
}
const netOf = x => x.rol ? x.rol.calc.neto : projection(x.emp,x.p).neto;
const preReg = x => !x.rol && x.emp && x.emp.creado && x.p.pago < x.emp.creado.slice(0,10);
function statusOf(x){
  if(preReg(x)) return {k:'inactivo',t:'Antes del registro'};
  if(!x.rol) return x.p.pago < todayS() ? {k:'vencido',t:'Sin generar, vencido'} : {k:'',t:'Sin generar'};
  const e = x.rol.estado;
  if(e==='pagado') return {k:'pagado',t:'Pagado'};
  if(x.rol.pago < todayS()) return {k:'vencido',t:e==='aprobado'?'Aprobado, vencido':'Borrador, vencido'};
  return e==='aprobado' ? {k:'aprobado',t:'Aprobado'} : {k:'borrador',t:'Borrador'};
}
function upcoming(limit){
  const ym = todayYM();
  const rows = [...rowsForMonth(addMonth(ym,-1)), ...rowsForMonth(ym), ...rowsForMonth(addMonth(ym,1))]
    .filter(x => !(x.rol && x.rol.estado==='pagado') && !preReg(x));
  return rows.sort((a,b)=>a.p.pago.localeCompare(b.p.pago)).slice(0,limit);
}
function nextPayFor(emp){
  if(!payable(emp)) return null;
  const t = todayS();
  for(const ym of [todayYM(), addMonth(todayYM(),1)]){
    for(const p of periods(emp,ym)){
      const r = S.rol[`${emp.id}_${ym}_${p.n}`];
      if(p.pago >= t && !(r && r.estado==='pagado')) return p.pago;
    }
  }
  return null;
}
const nextNum = () => Object.values(S.rol).reduce((m,r)=>Math.max(m, +r.numero||0), 0) + 1;
const snapMulta = m => ({id:m.id, tipo:m.tipo, fecha:m.fecha, motivo:m.motivo, monto:r2(m.monto)});
function buildRol(emp, p, ym){
  const {sueldo,dias} = prorate(emp,p);
  const pend = pendingMultas(emp.id, p.hasta);
  const r = {
    id:`${emp.id}_${ym}_${p.n}`, numero:nextNum(), empId:emp.id, ym, n:p.n, frecuencia:emp.frecuencia||'mensual',
    desde:p.desde, hasta:p.hasta, pago:p.pago,
    e:{nombre:emp.nombre, cedula:emp.cedula, codigo:emp.codigo, cargo:emp.cargo, dept:emp.dept, fechaIngreso:emp.fechaIngreso, contrato:emp.contrato, formaPago:emp.formaPago, banco:emp.banco, cuenta:emp.cuenta},
    sueldoMensual:+emp.sueldo||0, afiliado:emp.afiliado!==false, iessPct:+S.cfg.iess||0,
    ing:{sueldo, dias, hsupH:0, hextH:0, comisiones:0, bonificaciones:0, otrosIngresos:0, otros:0},
    desc:{anticipos:0, prestamos:0, autorizados:0, otrosDesc:0, otros:0},
    multas: pend.map(snapMulta), obs: dias < p.base ? `Sueldo proporcional por ${dias} días laborados desde el ingreso.` : '',
    estado:'borrador', creado:new Date().toISOString()
  };
  return {r:calc(r), pend};
}
async function generate(rows){
  let n=0;
  for(const x of rows){
    if(S.rol[x.id]) continue;
    const {r,pend} = buildRol(x.emp, x.p, x.ym);
    await put('rol', r.id, r);
    for(const m of pend) await put('mul', m.id, {...m, estado:'aplicada', rolId:r.id});
    n++;
  }
  return n;
}

function bdayInfo(e){
  if(!e.nacimiento) return null;
  const [y,m,d] = e.nacimiento.split('-').map(Number);
  const t = pd(todayS());
  let nb = new Date(t.getFullYear(), m-1, d);
  if(nb < t) nb = new Date(t.getFullYear()+1, m-1, d);
  return {date:ymd(nb), days:daysBetween(todayS(), ymd(nb)), age:nb.getFullYear()-y, m:m-1, d};
}

const cajaName = id => (S.cfg.cajas.find(c=>c.id===id)||{}).name || 'Caja';
function cashCalc(c){
  const n=v=>Number(v)||0;
  const ing = sum(ING_CAJA.map(([k])=>c.ing?.[k]));
  const egr = sum(EGR_CAJA.map(([k])=>c.egr?.[k]));
  const teorico = r2(n(c.inicial)+ing-egr);
  const contado = r2(sum(DEN.map(([k,v])=>n(c.conteo?.[k])*v)) + n(c.otrosValores));
  const dif = r2(contado-teorico);
  return {ing, egr, teorico, contado, dif, res: Math.abs(dif)<0.005 ? 'ok' : dif<0 ? 'bad' : 'over'};
}
const resLabel = r => ({ok:'Cuadrado', bad:'Faltante', over:'Sobrante'})[r];
function prevCierre(fecha, caja){
  const p = Object.values(S.cua).filter(c=>c.caja===caja && c.fecha<fecha).sort((a,b)=>b.fecha.localeCompare(a.fecha))[0];
  return p ? cashCalc(p).contado : 0;
}

/* ================= finanzas ================= */
function finMonth(ym){
  const ing={}, egr={};
  Object.values(S.fin).filter(f=>f.fecha.slice(0,7)===ym).forEach(f=>{ const t=f.tipo==='ingreso'?ing:egr; t[f.categoria]=r2((t[f.categoria]||0)+(+f.monto||0)); });
  const nom = sum(Object.values(S.rol).filter(r=>r.estado==='pagado' && (r.pagadoEn||r.pago).slice(0,7)===ym).map(r=>r.calc.neto));
  if(nom) egr['Nómina (roles pagados)'] = nom;
  const ti = sum(Object.values(ing)), te = sum(Object.values(egr));
  const red = sum(Object.values(S.com).filter(c=>c.mes===ym).map(c=>c.monto));
  return {ing, egr, ti, te, res:r2(ti-te), red};
}
function chartSVG(months){
  const W=640,H=230,pl=56,pr=10,pt=14,pb=30;
  const data = months.map(ym=>({ym, ...finMonth(ym)}));
  const max = Math.max(1, ...data.map(d=>Math.max(d.ti,d.te)));
  const raw = max/4, mag = Math.pow(10, Math.floor(Math.log10(raw))); const nice = [1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=raw); const top = nice*4;
  const iw=W-pl-pr, ih=H-pt-pb, gw=iw/data.length, bw=Math.min(26,gw/3.2);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y egresos de los últimos ${data.length} meses">`;
  for(let i=0;i<=4;i++){ const v=top*i/4, y=pt+ih-ih*i/4; s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v>=1000?new Intl.NumberFormat('es-EC',{maximumFractionDigits:1}).format(v/1000)+'k':NF0.format(v)}</text>`; }
  data.forEach((d,i)=>{ const x=pl+gw*i+gw/2; const hi=ih*d.ti/top, he=ih*d.te/top;
    s+=`<rect x="${x-bw-2}" y="${pt+ih-hi}" width="${bw}" height="${hi}" rx="3" fill="var(--gold)"><title>${monthLabel(d.ym)}: ingresos ${money(d.ti)}</title></rect>`;
    s+=`<rect x="${x+2}" y="${pt+ih-he}" width="${bw}" height="${he}" rx="3" fill="var(--danger)" opacity=".85"><title>${monthLabel(d.ym)}: egresos ${money(d.te)}</title></rect>`;
    s+=`<text x="${x}" y="${H-10}" text-anchor="middle" font-size="12" fill="${d.ym===UI.finMonth?'var(--ink)':'var(--muted)'}" font-weight="${d.ym===UI.finMonth?700:400}">${cap(shortMonth(d.ym+'-01'))}</text>`; });
  return s+'</svg>';
}

  ${rows.map(x=>{ const st=statusOf(x); const v = x.rol?x.rol.calc:projection(x.emp,x.p); const cls = x.rol?'':'proj'; const mul = x.rol ? v.multas : v.mul;

    <td class="num">${esc(fd(x.p.desde))} al ${esc(fd(x.p.hasta))}${x.emp.frecuencia==='quincenal'?`<small>Quincena ${x.p.n}</small>`:''}</td>

/* ---------- Multas ---------- */
function mulStatus(m){
  if(m.estado==='pendiente') return `<span class="pill pendiente">Por descontar</span>`;
  if(m.estado==='aplicada'){ const r=S.rol[m.rolId]; return `<span class="pill aplicada">En rol ${r?'N.º '+pad(r.numero,6):''}</span>`; }
  if(m.estado==='anulada') return `<span class="pill inactivo">Anulada</span>`;
  return `<span class="pill aprobado">Registrado</span>`;
}

/* ---------- Cuadres de caja ---------- */
VIEWS.caja = function(){
  const ym = UI.cajaMonth || todayYM(); const t = todayS();

  const cajas = S.cfg.cajas;
  const monthC = Object.values(S.cua).filter(c=>c.fecha.slice(0,7)===ym);
  const calcs = monthC.map(c=>({c, k:cashCalc(c)}));
  const falt = sum(calcs.filter(x=>x.k.dif<0).map(x=>-x.k.dif));
  const sobr = sum(calcs.filter(x=>x.k.dif>0).map(x=>x.k.dif));
  const dep = sum(monthC.map(c=>c.egr?.deposito));
  const cuad = calcs.filter(x=>x.k.res==='ok').length;
  const head = `<header class="vh"><div><h1>Cuadres de caja</h1><p class="sub">Matriz diaria del dinero que maneja cada caja: saldo inicial, ingresos, egresos y conteo de billetes. El sistema marca si cuadra, falta o sobra.</p></div>
    <div class="acts"><div class="monthnav"><button class="btn sm" data-act="cmonth" data-k="-1" aria-label="Mes anterior">‹</button><b>${esc(monthLabel(ym))}</b><button class="btn sm" data-act="cmonth" data-k="1" aria-label="Mes siguiente">›</button></div>
    <button class="btn" data-act="go-empresa" data-tab="cajas">Configurar cajas</button><button class="btn gold" data-act="open-cuadre" data-fecha="${t}" data-caja="${cajas[0].id}">Cuadre de hoy</button></div></header>`;
  const days = []; for(let d=ld; d>=1; d--){ const f=`${ym}-${pad(d)}`; if(f<=t || S.cfg.cajas.some(c=>S.cua[`${f}_${c.id}`])) days.push(f); }
  return head + `
  <section class="strip">
    <div><small>Cuadres registrados</small><b class="num">${monthC.length}</b><em>${cuad} cuadrados exactos</em></div>
    <div><small>Faltantes del mes</small><b class="num neg">${money(falt)}</b><em>${calcs.filter(x=>x.k.dif<0).length} días con faltante</em></div>
    <div><small>Sobrantes del mes</small><b class="num">${money(sobr)}</b></div>

    <td class="r num">${ks.some(Boolean)?money(dI):'—'}</td><td class="r num">${ks.some(Boolean)?money(dE):'—'}</td><td class="r num ${dD<0?'neg':''}"><b>${ks.some(Boolean)?money(dD):'—'}</b></td></tr>`; }).join('')}
  </tbody><tfoot><tr><td>Total</td>${cajas.map(c=>{ const cs=calcs.filter(x=>x.c.caja===c.id); return `<td class="r num">${cs.length?money(sum(cs.map(x=>x.k.dif))):'—'}</td>`; }).join('')}<td class="r num">${money(sum(calcs.map(x=>x.k.ing)))}</td><td class="r num">${money(sum(calcs.map(x=>x.k.egr)))}</td><td class="r num">${money(sum(calcs.map(x=>x.k.dif)))}</td></tr></tfoot></table></div>
  <p class="muted" style="font-size:13px">Cada celda muestra la diferencia entre lo contado y lo que debería haber. Toca una celda para abrir o registrar el cuadre.</p>`

};

VIEWS.finanzas = function(){
  const ym = UI.finMonth || todayYM();
  const f = finMonth(ym); const prev = finMonth(addMonth(ym,-1));
  const months = Array.from({length:6},(_,i)=>addMonth(ym,i-5));
  const delta = (a,b) => b ? `${a>=b?'+':''}${NF0.format((a-b)/Math.abs(b)*100)}% vs. mes anterior` : 'Sin datos del mes anterior';
  const catBars = (o,color) => { const e=Object.entries(o).sort((a,b)=>b[1]-a[1]); const mx=Math.max(1,...e.map(x=>x[1])); return e.length ? `<div class="bars">${e.map(([k,v])=>`<div><div class="bar-h"><span>${esc(k)}</span><span class="num">${money(v)}</span></div><div class="bar"><i style="width:${v/mx*100}%;background:${color}"></i></div></div>`).join('')}</div>` : '<p class="muted">Sin movimientos este mes.</p>'; };
  const mov = Object.values(S.fin).filter(x=>x.fecha.slice(0,7)===ym).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const com = Object.values(S.com).filter(c=>c.mes===ym).sort((a,b)=>b.monto-a.monto);
  const head = `<header class="vh"><div><h1>Finanzas</h1><p class="sub">Ingresos, gastos y resultado del mes. La nómina pagada entra sola como egreso desde Roles de pago.</p></div>
    <div class="acts"><div class="monthnav"><button class="btn sm" data-act="fmonth" data-k="-1" aria-label="Mes anterior">‹</button><b>${esc(monthLabel(ym))}</b><button class="btn sm" data-act="fmonth" data-k="1" aria-label="Mes siguiente">›</button></div>
    <button class="btn" data-act="new-mov" data-tipo="egreso">Registrar gasto</button><button class="btn gold" data-act="new-mov" data-tipo="ingreso">Registrar ingreso</button></div></header>`;
  return head + `
  <section class="strip">
    <div><small>Ingresos</small><b class="num">${money(f.ti)}</b><em>${delta(f.ti,prev.ti)}</em></div>
    <div><small>Egresos</small><b class="num">${money(f.te)}</b><em>${delta(f.te,prev.te)}</em></div>
    <div class="hl"><small>Resultado del mes</small><b class="num ${f.res<0?'neg':''}">${money(f.res)}</b><em>${f.ti?`Margen ${NF0.format(f.res/f.ti*100)}%`:'Sin ingresos registrados'}</em></div>
    <div><small>Producción de la red</small><b class="num">${moneyK(f.red)}</b><em>${com.length} agencias, informativo</em></div>
  </section>
  <div class="grid2" style="margin-bottom:22px">
    <section class="panel chart"><div class="ph"><h2>Últimos 6 meses</h2></div>${chartSVG(months)}<div class="legend"><span><i style="background:var(--gold)"></i>Ingresos</span><span><i style="background:var(--danger)"></i>Egresos</span></div></section>
    <div class="stack">
      <section class="panel"><div class="ph"><h2>Ingresos por categoría</h2></div>${catBars(f.ing,'var(--gold)')}</section>
      <section class="panel"><div class="ph"><h2>Egresos por categoría</h2></div>${catBars(f.egr,'var(--danger)')}</section>
    </div>
  </div>
  <div class="seg" role="tablist"><button class="${UI.finTab==='mov'?'on':''}" data-act="fin-tab" data-id="mov">Movimientos (${mov.length})</button><button class="${UI.finTab==='com'?'on':''}" data-act="fin-tab" data-id="com">Comisiones por agencia (${com.length})</button></div>
  ${UI.finTab==='mov' ? (mov.length ? `<div class="tw"><table class="t"><thead><tr><th>Fecha</th><th>Tipo</th><th>Categoría</th><th>Concepto</th><th>Cuenta</th><th class="r">Valor</th><th></th></tr></thead><tbody>
    ${mov.map(x=>`<tr><td class="num">${esc(fd(x.fecha))}</td><td><span class="pill ${x.tipo==='ingreso'?'ok':'bad'}">${x.tipo==='ingreso'?'Ingreso':'Egreso'}</span></td><td>${esc(x.categoria)}</td><td>${esc(x.concepto)}${x.ref?`<small>Ref. ${esc(x.ref)}</small>`:''}</td><td>${esc(x.cuenta)}</td><td class="r num"><b class="${x.tipo==='ingreso'?'':'neg'}">${x.tipo==='ingreso'?'':'−'}${money(x.monto)}</b></td><td><div class="rowacts"><button class="btn sm quiet" data-act="edit-mov" data-id="${x.id}">Editar</button></div></td></tr>`).join('')}
    </tbody></table></div>` : emptyBlock('Sin movimientos este mes', 'Registra los ingresos de BENDERAM y los gastos de la empresa: arriendo, servicios, publicidad, impuestos y más.', `<button class="btn gold" data-act="new-mov" data-tipo="ingreso">Registrar ingreso</button>`))
  : (com.length ? `<p class="muted" style="font-size:13.5px;margin-top:0">Comisión reportada por cada agencia en el mes. Es un dato de producción de la red y no se suma al resultado. Registra la comisión que recibe BENDERAM como un ingreso.</p><div class="tw"><table class="t"><thead><tr><th>#</th><th>Agencia</th><th>Operador</th><th>Plataforma</th><th class="r">Comisión</th><th class="r">Participación</th></tr></thead><tbody>
    ${com.map((c,i)=>{ const a=S.age[c.agenciaId]; return `<tr class="click" data-act="edit-age" data-id="${c.agenciaId}"><td class="num muted">${i+1}</td><td><b>${esc(a?(a.nombre||a.usuario):'Agencia eliminada')}</b><small>ID ${esc(a?.codigo||'')}</small></td><td>${esc(a?.operador||'')}</td><td>${esc(c.plataforma)}</td><td class="r num"><b>${money(c.monto)}</b></td><td class="r num">${NF.format(c.monto/f.red*100)}%</td></tr>`; }).join('')}
    </tbody><tfoot><tr><td colspan="4">Total de la red</td><td class="r num">${money(f.red)}</td><td></td></tr></tfoot></table></div>` : emptyBlock('Sin comisiones este mes', 'Las comisiones por agencia se cargan desde el archivo de datos o desde la ficha de cada agencia.', ''))}`;
};

function fillAgencias(){
  const tb=$('#atb'); if(!tb) return;

  let list = Object.values(S.age).filter(a=>UI.agF==='all'||a.estado===UI.agF);
  if(q) list = list.filter(a=>[a.usuario,a.nombre,a.codigo,a.propietario,a.ciudad,a.provincia,a.operador].join(' ').toLowerCase().includes(q));
  list = list.map(a=>({a, c:lastCom(a)})).sort((x,y)=>(y.c?.monto||0)-(x.c?.monto||0) || x.a.usuario.localeCompare(y.a.usuario));
  tb.innerHTML = list.length ? list.map(({a,c})=>{ const n=docsCount(a); const as=S.emp[a.asesor]; const st=EST_AG[a.estado]||{label:a.estado,cls:''}; return `<tr class="click" data-act="edit-age" data-id="${a.id}">

function obligaciones(){
  const t = pd(todayS()); const y = t.getFullYear();
  const nx = (m,d) => { let x=new Date(y,m,d); if(x<t) x=new Date(y+1,m,d); return ymd(x); };
  const nm = (d) => { let x=new Date(y,t.getMonth(),d); if(x<t) x=new Date(y,t.getMonth()+1,d); return ymd(x); };
  return [
    [nm(15),'Pago de aportes al IESS','Planillas del mes anterior. Pagar hasta el día 15 evita recargos e intereses.'],
    [nm(28),'Declaraciones mensuales del SRI','IVA y retenciones. La fecha exacta depende del noveno dígito del RUC (entre el 10 y el 28).'],
    [nx(3,15),'Pago de utilidades','15% de las utilidades a los trabajadores, hasta el 15 de abril.'],
    [nx(7,15),'Décimo cuarto sueldo (Sierra y Amazonía)','Un salario básico unificado, hasta el 15 de agosto, salvo que se pague mensualizado.'],
    [nx(11,24),'Décimo tercer sueldo','Doceava parte de lo ganado en el año, hasta el 24 de diciembre, salvo que se pague mensualizado.']
  ].sort((a,b)=>a[0].localeCompare(b[0]));
}

/* ================= overlays ================= */
function openLayer(html, center){
  $('#layer').innerHTML = `<div class="ov ${center?'center':''}" data-ov>${html}</div>`;
  const first = $('#layer').querySelector('input:not([type=hidden]):not([readonly]),select,textarea,button');
  setTimeout(()=>first && first.focus({preventScroll:true}), 30);
  document.body.style.overflow='hidden';
}
function closeLayer(){ $('#layer').innerHTML=''; ED=null; document.body.style.overflow=''; if(pendingRender) render(); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && $('#layer').innerHTML && !document.querySelector('.ov.ask')) closeLayer(); });
$('#layer').addEventListener('mousedown', e=>{ if(e.target.matches('[data-ov]')) closeLayer(); });

function ask(title, msg, okLabel, danger){
  return new Promise(res=>{
    const wrap = document.createElement('div');
    wrap.className='ov center ask'; wrap.style.zIndex=70; wrap.style.alignItems='center';
    wrap.innerHTML = `<div class="modal small-modal" role="dialog" aria-modal="true"><h2>${esc(title)}</h2><p>${esc(msg)}</p><div class="acts" style="justify-content:flex-end"><button class="btn" data-a="no">Cancelar</button><button class="btn ${danger?'bad':'gold'}" data-a="yes">${esc(okLabel)}</button></div></div>`;
    document.body.appendChild(wrap);
    wrap.querySelector('[data-a=yes]').focus();
    const done = v => { wrap.remove(); res(v); };
    wrap.addEventListener('click', e=>{ const a=e.target.closest('[data-a]'); if(a) done(a.dataset.a==='yes'); else if(e.target===wrap) done(false); });
    wrap.addEventListener('keydown', e=>{ if(e.key==='Escape'){ e.stopPropagation(); done(false); } });
  });
}
let tt;
function toast(msg, err){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div'); t.className='toast'+(err?' err':''); t.setAttribute('role','status'); t.textContent=msg;
  document.body.appendChild(t); clearTimeout(tt); tt=setTimeout(()=>t.remove(), err?5200:2800);
}

async function submitMul(form){

}

    if(p.length===2){ c[p[0]] = c[p[0]]||{}; c[p[0]][p[1]] = val; } else c[p[0]] = val;
    const k = cashCalc(c);
    const set=(o,v)=>{ const el=$(`[data-o="${o}"]`); if(el) el.textContent=v; };
    set('inicial',money(c.inicial)); set('teorico',money(k.teorico)); set('contado',money(k.contado)); set('contado2',money(k.contado)); set('ing',money(k.ing)); set('egr',money(k.egr));
    DEN.forEach(([key,v])=>set('den_'+key, money((+c.conteo?.[key]||0)*v)));
    const r=$('[data-o="res"]'); if(r){ r.className='res '+k.res; r.innerHTML=`<small>${resLabel(k.res)}</small><b class="num">${money(k.dif)}</b>`; }
    return;
  }
  if(ED && ED.r && t.matches('.doc-in[data-k]')){
    const [a,b] = t.dataset.k.split('.');
    if(a==='obs') ED.r.obs = t.value; else ED.r[a][b] = t.value===''?0:r2(t.value);
    calc(ED.r);
    document.querySelectorAll('[data-o]').forEach(el=>el.textContent = money(ED.r.calc[el.dataset.o]));
  }
});

async function submitAge(form){
  const fdata = new FormData(form); const v = Object.fromEntries(fdata.entries());
  Object.keys(v).forEach(k=>{ if(typeof v[k]==='string') v[k]=v[k].trim(); });
  const id = form.dataset.id || 'a_'+(v.usuario||'').toLowerCase().replace(/\W/g,'_')+'_'+Date.now().toString(36);
  const errs={};
  if(!v.usuario) errs.usuario='Escribe el usuario de la agencia.';
  else if(Object.values(S.age).some(a=>a.usuario.toLowerCase()===v.usuario.toLowerCase() && a.id!==id)) errs.usuario='Ya existe una agencia con este usuario.';
  if(v.correo && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.correo)) errs.correo='Escribe un correo válido.';
  if(markErrors(form, errs)) return;
  const docs = Object.fromEntries(DOCS.map(([k])=>[k, fdata.has('doc_'+k)]));
  const prev = S.age[id]||{};
  const data = {...prev, id, usuario:v.usuario, codigo:v.codigo, nombre:v.nombre, plataforma:v.plataforma, operador:v.operador, propietario:v.propietario, docId:v.docId, telefono:v.telefono, correo:v.correo,
    provincia:v.provincia, ciudad:v.ciudad, direccion:v.direccion, estado:v.estado, fechaCreacion:v.fechaCreacion, asesor:v.asesor, docs, obs:v.obs, creado:prev.creado||new Date().toISOString(), actualizado:new Date().toISOString()};
  if(data.estado==='activa' && prev.estado!=='activa' && docsCount(data)<DOCS.length && !(await ask('Activar con documentos pendientes', `Faltan ${DOCS.length-docsCount(data)} documentos. ¿Quieres activar la agencia de todas formas?`, 'Activar'))) return;
  closeLayer(); await put('age', id, data); render(); toast(form.dataset.id?'Agencia actualizada':'Agencia registrada');
}

  const st = statusOf({rol:r, p:{pago:r.pago}});
  const pendNew = pendingMultas(r.empId, r.hasta).filter(m=>!r.multas.some(x=>x.id===m.id));
  let acts = '';
  if(r.estado==='borrador') acts = `<button class="btn quiet bad" data-act="rol-del">Eliminar</button>${pendNew.length?`<button class="btn" data-act="rol-refresh-mul">Actualizar multas (${pendNew.length})</button>`:''}<button class="btn" data-act="rol-save">Guardar borrador</button><button class="btn gold" data-act="rol-approve">Aprobar rol</button>`;
  else if(r.estado==='aprobado') acts = `<button class="btn quiet" data-act="rol-draft">Volver a borrador</button><button class="btn gold" data-act="rol-pay">Marcar como pagado</button>`;
  else acts = `<span class="muted" style="font-size:13px">Pagado el ${fd(r.pagadoEn)}</span><button class="btn quiet" data-act="rol-unpay">Deshacer pago</button>`;
  return `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="rolT">
    <div class="mbar"><h2 id="rolT">Rol N.º ${pad(r.numero,6)} <span class="pill ${st.k}">${st.t}</span></h2>
      <div class="acts">${acts}<button class="btn" data-act="rol-dl">Descargar</button><button class="btn" data-act="rol-print">Imprimir</button><button class="x" data-act="close" aria-label="Cerrar">×</button></div></div>
    <div class="mscroll" id="printArea">${docHTML(r, ed)}</div></div>`;
}
function openRol(id){
  const r = S.rol[id]; if(!r) return;
  ED = {r:clone(r), orig:new Set((r.multas||[]).map(m=>m.id))};
  openLayer(rolModal(), true);
}
function refreshRolModal(){ const sc = $('.ov.center') ? $('.ov.center').scrollTop : 0; $('#layer .ov').innerHTML = rolModal(); $('.ov.center').scrollTop = sc; }
async function saveRol(estado){
  const r = ED.r;
  if(estado) r.estado = estado;
  if(estado==='pagado') r.pagadoEn = todayS();
  if(estado==='aprobado') delete r.pagadoEn;
  calc(r); r.actualizado = new Date().toISOString();
  await put('rol', r.id, clone(r));
  const now = new Set(r.multas.map(m=>m.id));
  for(const id of now) if(!ED.orig.has(id) && S.mul[id]) await put('mul', id, {...S.mul[id], estado:'aplicada', rolId:r.id});
  for(const id of ED.orig) if(!now.has(id) && S.mul[id]) await put('mul', id, {...S.mul[id], estado:'pendiente', rolId:null});
  ED.orig = now;
  render(); refreshRolModal();
}
async function payDirect(id){
  const r = S.rol[id]; if(!r) return;
  await put('rol', id, {...r, estado:'pagado', pagadoEn:todayS(), actualizado:new Date().toISOString()});
  render(); toast(`Rol de ${r.e.nombre} marcado como pagado`);
}

/* ================= archivos ================= */
async function saveFile(filename, data, type){
  if(downloads){
    try{ await downloads.save({filename, data}); }catch(e){ if(e && e.code!=='declined') toast('No se pudo descargar el archivo.', true); }
    return;
  }
  try{
    const blob = data instanceof Blob ? data : new Blob([data], {type:type||'application/octet-stream'});
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }catch(e){ toast('No se pudo descargar el archivo.', true); }
}
const slug = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase();
const csvQ = v => `"${String(v??'').replace(/"/g,'""')}"`;
const csv = (rows) => '﻿'+rows.map(r=>r.map(csvQ).join(';')).join('\r\n');
async function importData(obj){
  if(!obj || typeof obj!=='object' || !KEYS.some(k=>obj[k] && typeof obj[k]==='object')){ toast('El archivo no tiene datos del panel.', true); return; }
  const counts = KEYS.map(k=>[k, obj[k]?Object.keys(obj[k]).length:0]).filter(x=>x[1]);
  const L = {emp:'colaboradores', mul:'multas', rol:'roles', cua:'cuadres', fin:'movimientos', age:'agencias', com:'comisiones', inv:'bienes', mag:'cuadres multiagencia'};
  if(!(await ask('Importar datos', `Se cargarán ${counts.map(([k,n])=>`${n} ${L[k]}`).join(', ')}. Los registros que ya existen se actualizan.`, 'Importar'))) return;
  toast('Importando datos…');
  for(const [k] of counts){
    for(const [id,doc] of Object.entries(obj[k])){
      if(!doc || typeof doc!=='object') continue;
      const merged = k==='emp' && S.emp[id] ? {...doc, ...S.emp[id], ...Object.fromEntries(Object.entries(doc).filter(([kk,vv])=>vv!==''&&vv!=null&&!(kk==='sueldo'&&!vv)))} : doc;
      if(mode==='db'){ S[k][id]=merged; try{ await db.collection(COL[k]).doc(id).set(merged); }catch(e){ fail(e); return; } }
      else S[k][id]=merged;
    }
  }
  if(obj.cfg && typeof obj.cfg==='object'){ await putCfg({...S.cfg, ...obj.cfg}); }
  if(mode!=='db') saveLocal();
  render(); toast('Datos importados');
}
$('#importFile').addEventListener('change', async e=>{
  const f = e.target.files[0]; e.target.value=''; if(!f) return;
  try{ importData(JSON.parse(await f.text())); }catch(err){ toast('No se pudo leer el archivo. Debe ser un .json del panel.', true); }
});

function magCalc(r){
  const n=v=>Number(v)||0;
  const rec = sum((r.recargas||[]).map(x=>x.monto));
  const pend = sum((r.recargas||[]).filter(x=>x.cobro==='pendiente').map(x=>x.monto));
  const cobDia = r2(rec - pend);
  const cobAnt = sum((r.cobros||[]).map(x=>x.monto));
  const teorico = r2(n(r.inicial) + n(r.cargado) - rec);
  const has = r.saldoFinal!=='' && r.saldoFinal!=null;
  const dif = has ? r2(n(r.saldoFinal) - teorico) : null;
  return {rec, pend, cobDia, cobAnt, cobrado:r2(cobDia+cobAnt), teorico, dif, res: dif==null ? 'none' : Math.abs(dif)<0.005 ? 'ok' : dif<0 ? 'bad' : 'over'};
}
function prevMagFinal(fecha, cuenta){
  const p = Object.values(S.mag).filter(m=>m.cuenta===cuenta && m.fecha<fecha && m.saldoFinal!=='' && m.saldoFinal!=null).sort((a,b)=>b.fecha.localeCompare(a.fecha))[0];
  return p ? +p.saldoFinal : 0;
}
const agKey = s => String(s||'').trim().toLowerCase();
function porCobrar(){
  const m = {};
  Object.values(S.mag).forEach(r=>{
    (r.recargas||[]).filter(x=>x.cobro==='pendiente' && agKey(x.agente)).forEach(x=>{ const k=agKey(x.agente); m[k]=m[k]||{nombre:x.agente.trim(), deuda:0, cobrado:0, ultima:''}; m[k].deuda=r2(m[k].deuda+(+x.monto||0)); if(r.fecha>m[k].ultima) m[k].ultima=r.fecha; });
    (r.cobros||[]).filter(x=>agKey(x.agente)).forEach(x=>{ const k=agKey(x.agente); m[k]=m[k]||{nombre:x.agente.trim(), deuda:0, cobrado:0, ultima:''}; m[k].cobrado=r2(m[k].cobrado+(+x.monto||0)); });
  });
  return Object.values(m).map(a=>({...a, saldo:r2(a.deuda-a.cobrado)})).filter(a=>Math.abs(a.saldo)>=0.005).sort((a,b)=>b.saldo-a.saldo);
}

  return `<datalist id="agList">${agentes.map(a=>`<option value="${esc(a)}">`).join('')}</datalist>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mT">
    <div class="mbar"><h2 id="mT">${esc(mName(c))}, ${esc(longDay(r.fecha))} <span class="pill ${r.estado}">${r.estado==='abierto'?'Abierto':'Cerrado'}</span></h2>
      <div class="acts">${!r.nuevo&&r.estado==='abierto'?'<button class="btn quiet bad" data-act="m-del">Eliminar</button>':''}${r.estado==='abierto'?'<button class="btn" data-act="m-save">Guardar</button><button class="btn gold" data-act="m-close">Cerrar cuadre</button>':'<button class="btn quiet" data-act="m-reopen">Reabrir</button>'}<button class="x" data-act="close" aria-label="Cerrar">×</button></div></div>
    <div class="cash">
      <div class="verdict">
        <div><small>Saldo inicial</small><b class="num" data-mo="inicial">${money(r.inicial)}</b></div>
        <div><small>Debería quedar</small><b class="num" data-mo="teorico">${money(k.teorico)}</b></div>
        <div><small>Saldo final reportado</small><b class="num" data-mo="final">${r.saldoFinal===''||r.saldoFinal==null?'—':money(r.saldoFinal)}</b></div>
        <div class="res ${k.res==='none'?'':k.res}" data-mo="res"><small>${k.res==='none'?'Diferencia':resLabel(k.res)}</small><b class="num">${k.dif==null?'—':money(k.dif)}</b></div>
      </div>
      <div class="stack">
        <section class="panel"><h3 style="margin-bottom:10px">Saldos de la cuenta</h3><div class="fg">
          <div class="f full"><label for="m_resp">Responsable</label><select id="m_resp" data-m="responsable" ${ro?'disabled':''}><option value="">Elige</option>${activeEmps().map(e=>`<option value="${e.id}" ${r.responsable===e.id?'selected':''}>${esc(e.nombre)}</option>`).join('')}</select></div>
          <div class="f"><label>Saldo inicial</label>${num('inicial',r.inicial)}</div>
          <div class="f"><label>Saldo cargado hoy</label>${num('cargado',r.cargado)}<div class="hint">Saldo que se compró o depositó en la cuenta.</div></div>
          <div class="f full"><label>Saldo final en la plataforma</label>${num('saldoFinal',r.saldoFinal)}<div class="hint">Lo que muestra la cuenta al cierre del día.</div></div>
          <div class="f full"><label for="m_obs">Observaciones</label><textarea id="m_obs" data-m="obs" ${ro?'readonly':''}>${esc(r.obs)}</textarea></div>
        </div></section>
        <section class="panel"><h3 style="margin-bottom:6px">Cobros de días anteriores</h3>
          <table><tbody>${(r.cobros||[]).map((x,i)=>`<tr><td><input data-m="cobros.${i}.agente" list="agList" value="${esc(x.agente)}" placeholder="Agente" style="text-align:left" ${ro?'readonly':''} aria-label="Agente"></td><td class="r">${num(`cobros.${i}.monto`,x.monto)}</td><td style="width:40px">${ro?'':`<button class="btn sm quiet bad" data-act="m-rm" data-list="cobros" data-i="${i}" aria-label="Quitar">×</button>`}</td></tr>`).join('') || '<tr><td class="muted" style="font-size:14px">Sin cobros de deudas anteriores.</td></tr>'}
          <tr class="tot"><td>Total cobrado de deudas</td><td class="r num" data-mo="cobAnt">${money(k.cobAnt)}</td><td></td></tr></tbody></table>
          ${ro?'':'<button class="btn sm" style="margin-top:10px" data-act="m-add" data-list="cobros">Agregar cobro</button>'}
        </section>
      </div>
      <section class="panel"><h3 style="margin-bottom:6px">Recargas a agentes</h3>
        <table><tbody>${(r.recargas||[]).map((x,i)=>`<tr><td><input data-m="recargas.${i}.agente" list="agList" value="${esc(x.agente)}" placeholder="Usuario del agente" style="text-align:left" ${ro?'readonly':''} aria-label="Agente"></td><td class="q" style="width:110px">${num(`recargas.${i}.monto`,x.monto)}</td><td style="width:150px"><select data-m="recargas.${i}.cobro" ${ro?'disabled':''} aria-label="Forma de cobro" class="minisel">${COBROS.map(([v,l])=>`<option value="${v}" ${x.cobro===v?'selected':''}>${l}</option>`).join('')}</select></td><td style="width:40px">${ro?'':`<button class="btn sm quiet bad" data-act="m-rm" data-list="recargas" data-i="${i}" aria-label="Quitar">×</button>`}</td></tr>`).join('') || '<tr><td class="muted" style="font-size:14px">Sin recargas.</td></tr>'}
</tbody></table>
        <table style="margin-top:8px"><tbody>
        <tr class="tot"><td>Total recargado</td><td class="r num" data-mo="rec">${money(k.rec)}</td></tr>
        <tr><td class="muted">Cobrado en el día</td><td class="r num" data-mo="cobDia">${money(k.cobDia)}</td></tr>
        <tr><td class="muted">Quedó pendiente de cobro</td><td class="r num neg" data-mo="pend">${money(k.pend)}</td></tr></tbody></table>
        ${ro?'':'<button class="btn sm" style="margin-top:10px" data-act="m-add" data-list="recargas">Agregar recarga</button>'}
      </section>
    </div></div>`;
}
function refreshMulti(){ const sc=$('.ov.center')?.scrollTop||0; $('#layer .ov').innerHTML = multiHTML(); $('.ov.center').scrollTop=sc; }
function multiLive(){
  const r=ED.m, k=magCalc(r); const set=(o,v)=>{ const el=$(`[data-mo="${o}"]`); if(el) el.textContent=v; };
  set('inicial',money(r.inicial)); set('teorico',money(k.teorico)); set('final', r.saldoFinal===''||r.saldoFinal==null?'—':money(r.saldoFinal));
  set('rec',money(k.rec)); set('cobDia',money(k.cobDia)); set('pend',money(k.pend)); set('cobAnt',money(k.cobAnt));
  const el=$('[data-mo="res"]'); if(el){ el.className='res '+(k.res==='none'?'':k.res); el.innerHTML=`<small>${k.res==='none'?'Diferencia':resLabel(k.res)}</small><b class="num">${k.dif==null?'—':money(k.dif)}</b>`; }
}
function setMulti(t){
  const p=t.dataset.m.split('.'); const r=ED.m;
  const isNum = t.type==='number';
  const val = isNum ? (t.value===''?'':Number(t.value)) : t.value;
  if(p.length===3) r[p[0]][+p[1]][p[2]] = val;
  else r[p[0]] = (isNum && p[0]!=='saldoFinal' && val==='') ? 0 : val;
  multiLive();
}
$('#layer').addEventListener('input', e=>{ if(ED && ED.m && e.target.dataset.m) setMulti(e.target); });
$('#layer').addEventListener('change', e=>{ if(ED && ED.m && e.target.dataset.m && e.target.tagName==='SELECT') setMulti(e.target); });
async function saveMulti(estado){
  const r=ED.m;
  r.recargas = (r.recargas||[]).filter(x=>agKey(x.agente) || +x.monto);
  r.cobros = (r.cobros||[]).filter(x=>agKey(x.agente) || +x.monto);
  if(estado==='cerrado'){
    if(!r.responsable){ toast('Elige al responsable antes de cerrar.', true); return; }
    if(r.saldoFinal==='' || r.saldoFinal==null){ toast('Escribe el saldo final en la plataforma para cerrar el cuadre.', true); return; }
    if(r.recargas.some(x=>x.cobro==='pendiente' && !agKey(x.agente))){ toast('Escribe el agente de cada recarga pendiente de cobro.', true); return; }
  }
  if(estado) r.estado=estado;
  delete r.nuevo; r.actualizado=new Date().toISOString();
  await put('mag', r.id, clone(r));
  render(); refreshMulti();
}

/* ---------- acciones v3 ---------- */
Object.assign(ACT, {
  'inv-tab':d=>{ UI.invTab=d.id; render(); },
  'inv-cat':d=>{ UI.invCat=d.id; render(); },
  'new-inv':d=>invForm(null, d.emp?{responsable:d.emp}:null),
  'edit-inv':d=>invForm(d.id),
  'del-inv':async d=>{ if(!(await ask('Eliminar bien', 'Se borrará el bien y su historial. Si ya no se usa, mejor cambia su estado a "De baja".', 'Eliminar', true))) return; await del('inv', d.id); closeLayer(); render(); toast('Bien eliminado'); },
  acta:d=>openActa(d.id),
  'acta-dl':()=>{ const e=S.emp[ED.acta]; const html = `<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Acta de entrega ${esc(e.nombre)}</title><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Figtree:wght@400;600&display=swap" rel="stylesheet"><style>body{margin:0;padding:24px;background:#EFE8D8}${DOC_CSS}@media print{body{padding:0;background:#fff}.doc{border:0}}</style></head><body>${actaHTML(ED.acta)}</body></html>`; saveFile(`acta-entrega-${slug(e.nombre)}-${todayS()}.html`, html, 'text/html'); },
  'export-inv':()=>{ const out=[['Código','Bien','Categoría','Marca','Modelo','Serie','Responsable','Cédula','Departamento','Ubicación','Fecha de asignación','Estado','Fecha de compra','Valor','Proveedor','Observaciones']];
    Object.values(S.inv).sort((a,b)=>a.codigo.localeCompare(b.codigo)).forEach(i=>{ const e=S.emp[i.responsable]; out.push([i.codigo,i.nombre,i.categoria,i.marca,i.modelo,i.serie,e?.nombre||'',e?.cedula||'',e?deptName(e.dept):'',i.ubicacion,fd(i.fechaAsignacion),EST_INV[i.estado]?.label||'',fd(i.fechaCompra),NF.format(+i.valor||0),i.proveedor,i.obs]); });
    saveFile(`inventario-benderam-${todayS()}.csv`, csv(out), 'text/csv'); },
  mmonth:d=>{ UI.mMonth = addMonth(UI.mMonth||todayYM(), +d.k); render(); },
  'open-multi':d=>openMulti(d.fecha, d.cuenta),
  'm-add':d=>{ ED.m[d.list] = ED.m[d.list]||[]; ED.m[d.list].push(d.list==='recargas'?{agente:'',monto:'',cobro:'efectivo'}:{agente:'',monto:''}); refreshMulti(); const ins=document.querySelectorAll(`[data-m^="${d.list}."][list]`); ins[ins.length-1]?.focus(); },
  'm-rm':d=>{ ED.m[d.list].splice(+d.i,1); refreshMulti(); },
  'm-save':async ()=>{ await saveMulti(); toast('Cuadre guardado'); },
  'm-close':async ()=>{ const k=magCalc(ED.m); if(k.res==='bad'||k.res==='over'){ if(!(await ask('Cerrar con diferencia', `La cuenta tiene un ${resLabel(k.res).toLowerCase()} de ${money(Math.abs(k.dif))}. ¿Cerrar así?`, 'Cerrar cuadre'))) return; } await saveMulti('cerrado'); toast('Cuadre cerrado'); },
  'm-reopen':async ()=>{ await saveMulti('abierto'); toast('Cuadre reabierto'); },
  'm-del':async ()=>{ if(!(await ask('Eliminar cuadre', 'Se borrará el registro de este día.', 'Eliminar', true))) return; await del('mag', ED.m.id); closeLayer(); render(); toast('Cuadre eliminado'); },
  'multi-add':()=>{ $('#multiList').insertAdjacentHTML('beforeend', multiRow({id:uid('mc'), casa:'Mas Parley', usuario:'', responsable:''})); $('#multiList').lastElementChild.querySelector('input').focus(); },
  'multi-rm':async (d,b)=>{ const id=b.closest('.le').dataset.id; if(Object.values(S.mag).some(m=>m.cuenta===id) && !(await ask('Quitar cuenta', 'Esta cuenta tiene cuadres registrados. Dejarán de verse, pero no se borran.', 'Quitar'))) return; b.closest('.le').remove(); }
});
function multiRow(c){ return `<div class="le" data-id="${esc(c.id)}" style="grid-template-columns:1fr 1fr 1.2fr auto"><input name="casa" list="casaList" value="${esc(c.casa)}" placeholder="Casa" aria-label="Casa" required><input name="usuario" value="${esc(c.usuario)}" placeholder="Usuario de la cuenta" aria-label="Usuario de la cuenta"><select name="responsable" aria-label="Responsable"><option value="">Responsable</option>${activeEmps().map(e=>`<option value="${e.id}" ${c.responsable===e.id?'selected':''}>${esc(e.nombre)}</option>`).join('')}</select><button type="button" class="btn sm quiet bad" data-act="multi-rm">Quitar</button></div>`; }
document.addEventListener('submit', e=>{
  const f=e.target;
  if(f.id==='invForm') submitInv(f);
  if(f.id==='multiForm'){ const rows=[...f.querySelectorAll('.le')].map(r=>({id:r.dataset.id, casa:r.querySelector('[name=casa]').value.trim(), usuario:r.querySelector('[name=usuario]').value.trim(), responsable:r.querySelector('[name=responsable]').value})).filter(c=>c.casa);
    document.activeElement && document.activeElement.blur(); putCfg({...S.cfg, multi:rows}).then(()=>{ render(); toast('Cuentas multiagencia guardadas'); }); }
});
document.addEventListener('input', e=>{ if(e.target.id==='invq'){ UI.invQ=e.target.value; fillInv(); } });
document.addEventListener('keydown', e=>{
  if(e.target.id!=='invq' || e.key!=='Enter') return;
  e.preventDefault();
  const code = invCode(e.target.value);
  if(!code){ const one = Object.values(S.inv).filter(i=>[i.codigo,i.nombre].join(' ').toLowerCase().includes(UI.invQ.trim().toLowerCase())); if(one.length===1) invForm(one[0].id); return; }
  const it = Object.values(S.inv).find(i=>i.codigo===code);
  UI.invQ=''; e.target.value=''; fillInv();
  if(it) invForm(it.id); else invForm(null, {codigo:code});
});

/* ---------- migración: producción de la red en cero ---------- */
let migrated = false;
async function migrateV3(){
  if(migrated || S.cfg.migV3) return; migrated = true;
  for(const c of Object.values(S.com)) if(!c.manual) await del('com', c.id);
  await putCfg({...S.cfg, migV3:true});
  render();
}

/* ================= inicio ================= */
async function boot(){
  UI.month = UI.cajaMonth = UI.finMonth = UI.mMonth = todayYM();
  render();
  let d=null;
  if(window.claude && typeof window.claude.use==='function'){
    try{ [d, downloads] = await Promise.all([window.claude.use('db'), window.claude.use('downloads')]); }catch(e){ d=null; }
  }
  if(d){
    db=d; mode='db';
    const seen = new Set(); const need = KEYS.length+1;
    const done = k=>{ seen.add(k); if(seen.size>=need){ UI.ready=true; migrateV3(); } if(UI.ready) render(); };
    for(const k of KEYS){
      db.collection(COL[k]).onSnapshot(s=>{ S[k]=Object.fromEntries(s.docs.map(x=>[x.id,x.data()])); done(k); }, err=>{ toast('No se pudieron leer los datos: '+(err.message||err.code), true); done(k); });
    }
    db.doc('config/empresa').onSnapshot(s=>{ S.cfg={...clone(DEF_CFG),...(s.exists?s.data():{})}; done('cfg'); }, ()=>done('cfg'));
  } else {
    loadLocal(); UI.ready=true; render(); migrateV3();
  }
}
boot();
